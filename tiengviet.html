/* 프로필을 실제 utterance에 입힘. 목소리가 여러 개면 목소리로, 하나뿐이면 음높이로 구분. */
function spkApply(u, prof, pool, baseRate){
  const r = baseRate || ttsRate();
  if(!prof || prof.i < 0 || !spkVoiceOn()){ u.rate = r; return; }
  const n = (pool && pool.length) || 0;
  if(n > 1){
    const v = pool[prof.i % n]; u.voice = v; u.lang = v.lang;   // 사람마다 진짜 다른 목소리
    if(prof.i < n){ u.rate = r; }
    /* 사람이 목소리보다 많으면 남는 사람은 음높이로 한 번 더 갈라 줌 */
    else { try{ u.pitch = prof.pitch; }catch(e){} u.rate = r * prof.rate; }

function speak(text, lang, prof){

        try{ if(speechSynthesis.paused) speechSynthesis.resume(); }catch(e){}   // 굳어 있으면 풀고 시작
        const u = new SpeechSynthesisUtterance(ttsText(text, lang));
        u.lang = lang || "en-US";
        u.rate = ttsRate();
        const v = pickedVoice(lang); if(v){ u.voice = v; u.lang = v.lang; }
        /* 화자별 목소리 : 베트남어를 읽을 때만. 목소리를 못 고른 기기에서도 음높이는 먹으니 v 여부와 무관하게 적용 */

function speakLines(items, onLine, onDone){
  try{
    if(!window.speechSynthesis) return;
    if(!VOICES.length) loadVoices();
    ttsKeepStop();
    const texts = (items||[]).map(x => (typeof x === "string") ? {vn:x, who:""} : (x || {vn:"", who:""}));
    const plan = spkPlan(texts.map(x=>x.who)), pool = spkPool();
    const busy = speechSynthesis.speaking || speechSynthesis.pending;   // 아이폰: 누른 순간 speak해야 소리 남
    speechSynthesis.cancel();
    const my = ++TTS_SEQ;
    const go = ()=>{
      if(my !== TTS_SEQ) return;
      try{
        try{ if(speechSynthesis.paused) speechSynthesis.resume(); }catch(e){}   // 굳어 있으면 풀고 시작
        const v = pickedVoice("vi-VN"), r = ttsRate();
        texts.forEach((t, i)=>{
          const u = new SpeechSynthesisUtterance(ttsText(t.vn, "vi-VN"));

          if(v){ u.voice = v; u.lang = v.lang; }

      }catch(e){}
    };

  }catch(e){}
}

function spkBtn(text, lang, sm, prof){
  const pi = (prof && prof.i >= 0) ? ` data-pi="${prof.i}"` : "";
  return `<button class="spk${sm?" sm":""}" data-action="speak" data-text="${esc(text)}" data-lang="${lang}"${pi} title="발음 듣기"><svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><use href='#i-volume'/></svg></button>`;
}

   5) 화면 그리기
   ========================================================= */
const view = document.getElementById("view");
/* 화면을 다시 그릴 때 스크롤 처리:
   - '다른 화면'으로 넘어가면 맨 위로 (홈→설정, 다음 문제 등)
   - '같은 화면'을 다시 그리는 거면 있던 자리 유지 (칩·토글·힌트 버튼 등 → 맨 위로 안 튐)
   화면 구분은 state.screen 키. 문제 번호·페이지가 바뀌면 키도 바뀌게 해서 그땐 맨 위로 감. */
let LAST_SCREEN = null;
const set = h => {
  const same = (state.screen != null && state.screen === LAST_SCREEN);
  const y = window.scrollY;
  view.innerHTML = h;
  LAST_SCREEN = state.screen;
  window.scrollTo(0, same ? y : 0);
};
/* 시험지 컨트롤(방향·문장범위 등) 다시 그릴 때 스크롤 위치 유지 — set이 매번 맨 위로 올리는 걸 되돌림 */
const paperKeep = fn => { const y = window.scrollY; fn(); window.scrollTo(0, y); };
/* 화면 확대(글씨 크게/작게) — #view에 zoom 적용. 매 화면 자동 가운데 정렬돼 초점이 안 튐 */
const ZKEY = "_zoom";
let zoomLevel = Number(lsGet(ZKEY, 1)) || 1;
function applyZoom(){
  zoomLevel = Math.min(2, Math.max(0.8, Math.round(zoomLevel*100)/100));
  view.style.zoom = String(zoomLevel);
  const lbl = document.getElementById("zoomLbl");
  if(lbl) lbl.textContent = Math.round(zoomLevel*100)+"%";
  lsSet(ZKEY, zoomLevel);
}
function bindZoom(){
  const o=document.getElementById("zoomOutBtn"), i=document.getElementById("zoomInBtn"), l=document.getElementById("zoomLbl");
  if(o) o.addEventListener("click", ()=>{ zoomLevel-=0.1; applyZoom(); });
  if(i) i.addEventListener("click", ()=>{ zoomLevel+=0.1; applyZoom(); });
  if(l) l.addEventListener("click", ()=>{ zoomLevel=1; applyZoom(); });
}

function lessonOptionsFor(selectedLesson){
  return lessonsList().map(l=>`<option value="${l}" ${String(l)===String(selectedLesson)?"selected":""}>${lessonLabel(l)}</option>`).join("");
}
function numOptionsFor(lesson, selectedGi){
  return WORDS.filter(w=>String(w.lesson)===String(lesson))
    .map(w=>`<option value="${w.gi}" ${w.gi===selectedGi?"selected":""}>${w.num}. ${esc(w.vn)}</option>`).join("");
}
function rangeBounds(){ return [Math.min(state.rStart,state.rEnd), Math.max(state.rStart,state.rEnd)]; }

function selectionBlockHTML(showCount){
  const lessons = byPickOrder(lessonsList());   // 교재2권 → 교재1권 → 나머지 → 내 단어 (보여 주는 차례만)
  const chips = lessons.map(l=>{
    const c = WORDS.filter(w=>w.lesson===l).length;
    return `<button class="chip ${state.lessons.has(l)?"on":""}" data-action="toggleLesson" data-l="${l}">${lessonLabel(l)} <small>${c}</small></button>`;
  }).join("");
  const sW = WORDS[state.rStart], eW = WORDS[state.rEnd];
  const [a,b] = rangeBounds();
  const rangeBlock = `
    <div class="rng">
      <label class="fld">시작 단어</label>
      <div class="row2">
        <select class="sel" id="startLesson">${lessonOptionsFor(sW.lesson)}</select>
        <select class="sel" id="startNum">${numOptionsFor(sW.lesson, sW.gi)}</select>
      </div>
      <label class="fld">끝 단어</label>
      <div class="row2">
        <select class="sel" id="endLesson">${lessonOptionsFor(eW.lesson)}</select>
        <select class="sel" id="endNum">${numOptionsFor(eW.lesson, eW.gi)}</select>
      </div>
      <div class="rsum"><svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><use href='#i-pin'/></svg> ${lessonLabel(WORDS[a].lesson)} ${WORDS[a].num}번 <b>${esc(WORDS[a].vn)}</b> ~ ${lessonLabel(WORDS[b].lesson)} ${WORDS[b].num}번 <b>${esc(WORDS[b].vn)}</b></div>
    </div>`;
  /* 단원 칩이 40개가 넘어 교재 단위로 한 번에 고를 수 있게(단어 리스트 화면의 '빠른 선택'과 같은 묶음) */
  const bundles = `
      <div class="muted tiny" style="margin-bottom:6px">교재별로 한 번에 고르기</div>
      <div class="row" style="margin-bottom:10px">
        <button class="chip" data-action="selBundle" data-g="t2">교재2권 전체</button>
        <button class="chip" data-action="selBundle" data-g="t1">교재1권 전체</button>
        <button class="chip" data-action="selBundle" data-g="ex">Expats 전체</button>
        <button class="chip" data-action="selBundle" data-g="th">주제별 전체</button>
      </div>`;
  const selBlock = state.selMode==="range" ? rangeBlock : `
      ${bundles}
      <div class="row">${chips}</div>
      <div class="row" style="margin-top:10px">
        <button class="chip" data-action="allLessons">전체 선택</button>
        <button class="chip" data-action="noLessons">전체 해제</button>
      </div>`;
  return `
    <div class="seg" style="margin-bottom:12px">
      <button class="${state.selMode==="lesson"?"on":""}" data-action="selMode" data-v="lesson">단원별 선택</button>
      <button class="${state.selMode==="range"?"on":""}" data-action="selMode" data-v="range">번호로 범위 지정</button>
    </div>
    ${selBlock}
    ${showCount ? `<div class="muted tiny" style="margin-top:12px">선택한 단어 <b>${poolSelected().length}</b>개 / 전체 ${WORDS.length}개</div>` : ""}`;
}

    { t:"khá (꽤, 제법)", d:"「khá + 형용사」 보통보다 높지만 아주 심하지는 않은 정도. rất(매우)보다 **약해요**. 예: Nhà anh ấy khá xa công ty. (그의 집은 회사에서 꽤 멀어요) · Gia đình chị ấy khá đông anh em. (그 집은 형제가 꽤 많아요)" },
    { t:"chứ (그럼요, 당연하죠)", d:"대답 끝에 붙여 앞에서 말한 것을 **확신 있게 긍정**해요. 예: Có chứ! (그럼요!) · Bố mẹ tôi còn làm việc chứ. (부모님은 당연히 아직 일하시죠)" },
    { t:"가족·나이 말하기", d:"Gia đình chị có mấy người? (가족이 몇 명이에요?) · Anh là con thứ mấy? (몇째예요?) → con cả(맏이) · con thứ hai(둘째) · con út(막내) · con một(외동). 나이 비교는 「A + lớn hơn / nhỏ hơn + B + 숫자 + tuổi」, 동갑이면 cùng tuổi(=bằng tuổi). 예: Em tôi nhỏ hơn tôi 4 tuổi." },
  ]},
  11: { name:"교통수단 · 반복·가정·부정·지속", items:[
    { t:"bằng (~을 타고, ~으로)", d:"「동사 + bằng + 수단」 무엇을 타고 가는지 말할 때 써요. 묻는 말은 「bằng gì?」(뭘 타고?). 예: Anh thường đi làm bằng gì? (보통 뭘 타고 출근해요?) / Tôi đi bằng xe máy. (저는 오토바이로 가요.) ⚠️ **걸어가는 것만 예외**로 bằng을 안 쓰고 그냥 đi bộ 라고 해요." },
    { t:"lại (다시, 도로)", d:"「동사 + lại」 앞에 한 번 있었던 행동을 **한 번 더** 한다는 뜻. 위치는 동사 **뒤**예요. 예: Xin cô nói lại. (선생님, 다시 말씀해 주세요) · Chút nữa tôi sẽ gọi lại. (조금 뒤에 다시 전화할게요) · Bây giờ anh ấy sẽ đặt lại. (이제 다시 예약할 거예요)" },
    { t:"nếu ... thì ... (~하면 ~한다)", d:"앞은 **조건**, 뒤는 **결과**. 「Nếu + 조건 + thì + 결과」. 예: Nếu trời mưa thì tôi đi tắc xi. (비가 오면 저는 택시를 타요) 결과 쪽에는 sẽ 를 자주 같이 써요. thì 는 생략하기도 해요. 예: Nếu chị không sợ, tôi sẽ tập cho chị đi bằng xe máy." },
    { t:"không ... đâu (안 그래요, 절대 아니에요)", d:"권유를 **거절**하거나 상대 말을 **부드럽게 뒤집을** 때. 「không + 동사/형용사 + đâu」 문장 끝에 đâu 를 붙여요. 예: Tôi không đi đâu. (저는 안 가요) · Không phức tạp đâu. (복잡하지 않아요) · Không trễ đâu. (안 늦어요)" },
    { t:"chưa ... đâu (아직 아니에요)", d:"không 자리에 chưa 를 넣으면 '**아직** 안 그렇다'가 돼요. 예: Nó chưa đói. → Nó chưa đói đâu. (걔 아직 배 안 고파요) · Ở thành phố của tôi chưa có xe điện ngầm đâu." },
    { t:"đâu 의 두 얼굴 (헷갈림 주의)", d:"같은 글자지만 뜻이 둘이에요. 문장 **끝**의 đâu 는 **강한 부정**(Tôi không đi đâu = 저는 안 가요), 의문사 đâu 는 **어디**(Anh đi đâu? = 어디 가요?). 앞에 không/chưa 가 있으면 부정 쪽이에요." },
    { t:"vẫn (여전히, 아직도)", d:"동사·형용사 **앞**에 붙여 예전부터 지금까지 **계속 그렇다**는 뜻. 예: Trời vẫn mưa từ hôm qua đến giờ. (어제부터 지금까지 계속 비가 와요) · Chị vẫn đi bằng xe ôm à? (아직도 오토바이 택시 타고 다녀요?) 부정과 같이 쓰면 '아직도 안'. 예: Nó vẫn không hiểu. (걔는 여전히 이해 못 해요)" },
    { t:"교통수단 어휘 정리", d:"xe máy(오토바이) · xe đạp(자전거) · xe đạp điện(전기 자전거) · xe buýt(버스) · xe khách(시외버스) · xe hơi(자동차) · xe tắc xi(택시) · xe ôm(오토바이 택시) · xe điện(전차) · xe điện ngầm(지하철) · xe lửa/tàu(기차) · máy bay(비행기). 표는 vé, 편도는 vé một chiều, 왕복은 vé khứ hồi." },
  ]},
  12: { name:"복습(7~11과) · 명령·확인·정도·의문사", items:[
    { t:"12과는 새 문법이 아니라 복습 단원", d:"교재1 12과(BÀI 12)는 앞의 **7~11과를 한 번에 훑는 복습 단원**이에요. 교재가 178쪽에 적어 둔 범위는 이래요. 문법: nếu...thì..., đã...chưa, ...xong chưa, không...đâu / 부사 hơi·khá·sắp·mới·vẫn·còn·lại / 문장 끝 조사 đấy·chứ·đi / 접속사 nên / 동사 được·xong / 의문 표현 bao lâu·bao giờ·bao nhiêu·bao xa. 말하기: 하루 일과, 외국어 실력, 시간, 가족 소개, 교통수단. 아래 네 가지는 189~191쪽에서 교재가 따로 뽑아 정리해 준 '헷갈리는 짝'이에요." },
    { t:"đi 와 đừng (하라 / 하지 마라)", d:"둘 다 상대에게 시키는 말인데 방향이 반대예요. **đi**는 '~하세요, ~합시다'로 **하라고 권하는** 말, 자리는 문장 **맨 끝**. 예: Về nhà đi! (집에 가세요!) · Em ngồi đây đi! (여기 앉으세요!) · Chúng ta làm việc đi! (우리 일해요!) **đừng**은 '~하지 마세요'로 **하지 말라는** 말, 자리는 동사 **앞**. 예: Đừng về nhà! · Em đừng ngồi đây! · Chúng ta đừng làm việc! ⚠️ 자리가 서로 반대(đi는 뒤, đừng은 앞)라는 게 시험에 잘 나와요." },
    { t:"đấy 와 chứ (알려주기 / 당연하죠)", d:"**đấy**는 쓰임이 둘이에요. ① 평서문 끝에서 **알려 주거나 슬쩍 경고**할 때. 예: Họ biết rồi đấy. (그들은 벌써 알고 있어요) · Bố mẹ sẽ giận đấy. (부모님이 화내실 거예요) ② 의문문 끝에서 **잘 모르는 걸 물을** 때. 이때는 đấy 대신 **vậy**를 써도 같은 뜻이에요. 예: Anh đi đâu đấy? = Anh đi đâu vậy? · Nó hỏi gì đấy? = Nó hỏi gì vậy? **chứ**는 **대답**에서 '당연히 그렇죠'라고 **확실하게 긍정**할 때. 예: A: Thế, anh có cùng đi du lịch với họ không? B: Có chứ. (가죠) · A: Em hiểu không? B: Dạ, em hiểu chứ ạ." },
    { t:"hơi 와 khá (조금 / 꽤)", d:"둘 다 형용사 **앞**에 붙는 정도 부사인데 세기가 달라요. **hơi = 조금, 약간**(정도가 높지 않음). 예: Tôi hơi đói. (조금 배고파요) · Làm ở cơ quan này hơi vất vả. · Giao thông trong thành phố này hơi phức tạp. **khá = 꽤, 상당히**(정도가 비교적 높음). 예: Gia đình đó khá đông con. (그 집은 자녀가 꽤 많아요) · Làm ở cơ quan này khá vất vả. · Giao thông trong thành phố này khá phức tạp. 같은 문장에 hơi만 khá로 바꾸면 뜻이 '조금'에서 '꽤'로 세져요." },
    { t:"bao giờ · bao lâu · bao nhiêu · bao xa (bao 4형제)", d:"넷 다 bao로 시작해 헷갈리지만 묻는 대상이 달라요. **bao giờ = 언제**(시점). 문장 **앞**에 오면 앞으로 할 일, 문장 **뒤**에 오면 이미 한 일이에요. 예: Bao giờ cô ấy về nước? (언제 귀국해요?) · Ông đến đây bao giờ? (언제 오셨어요?) · Các bạn học tiếng Việt ở trường này từ bao giờ? **bao lâu = 얼마 동안**(기간). 예: Anh ta sẽ đi công tác bao lâu? · Họ đã họp bao lâu? · Gia đình cô đã sống ở đó bao lâu rồi? **bao nhiêu = 얼마·몇**(수량, 값). 예: Trường này có tất cả bao nhiêu lớp? · Nước suối bao nhiêu tiền? · Sách tiếng Việt giá bao nhiêu? **bao xa = 얼마나 먼가**(거리). 예: Từ đây đến nhà chị bao xa? · Từ Thành phố Hồ Chí Minh đến Bến Tre bao xa? (Khoảng 90 cây số.)" },
  ]},
  33: { name:"식당·주문 · 확인 의문문·경험·vừa A vừa B", items:[
    { t:"có phải X không? (X 맞지요?)", d:"내가 X라고 **생각하고 있고, 그게 맞는지 확인**받고 싶을 때 쓰는 물음이에요. có phải는 문장 **맨 앞**에 두거나 **묻고 싶은 부분 바로 앞**에 둘 수 있어요. 예(Anh Lee là người Trung Quốc): Có phải anh Lee là người Trung Quốc không? / Anh Lee có phải là người Trung Quốc không? / Anh Lee là người Trung Quốc, có phải không? ⚠️ **có X không?**은 'X인지 아닌지' 둘 중 하나를 고르라는 물음이고, **có phải X không?**은 이미 X라고 짐작하고 확인하는 물음이라 뜻이 달라요. 대답은 맞으면 '(Dạ), phải (rồi)!' '(Dạ), đúng (rồi)!', 아니면 '(Dạ), không (phải)!' '(Dạ), không phải (đâu)!'." },
    { t:"(đã) ... bao giờ chưa? (~해 본 적 있어요?)", d:"지금까지 **해 본 경험**이 있는지 묻는 말이에요. 「(đã) + 동사 + bao giờ chưa?」와 「đã bao giờ + 동사 + chưa?」 둘 다 같은 뜻이에요. 예: Chị (đã) ăn cơm sen bao giờ chưa? = Chị đã bao giờ ăn cơm sen chưa? 대답은 있으면 'Rồi, tôi đã ăn (nhiều lần) rồi.' 또는 '... đã từng ...', 없으면 'Chưa, tôi chưa bao giờ ăn.' 말할 때는 bao giờ 대신 **lần nào**를 써도 돼요." },
    { t:"vừa X vừa Y (X하면서 Y하다 / X하기도 Y하기도)", d:"두 가지가 **동시에 일어나거나 둘 다 그렇다**는 뜻이에요. 예: Anh ấy vừa ăn cơm vừa xem tivi. (그는 밥을 먹으면서 텔레비전을 봐요) · Phở bò ở căng tin vừa ngon vừa rẻ nên sinh viên rất thích. (구내식당 소고기 쌀국수는 맛있고 싸서 학생들이 아주 좋아해요) · Hiện nay tôi vừa đi học vừa đi làm nên rất bận. X와 Y는 보통 동사·형용사인데 가끔 **명사**도 와요. 예: Vừa thức ăn vừa thức uống, tất cả là một triệu đồng." },
    { t:"식당에서 쓰는 말 정리", d:"đặt bàn trước(미리 예약하다) · Chị đi mấy người?(몇 분이세요?) · Cho tôi ...(~ 주세요) · món gì ngon?(뭐가 맛있어요?) · món ăn no(배부른 음식) · ăn thử(먹어 보다) · tính tiền(계산하다) · Chị thấy ... thế nào?(~ 어떠세요?) · thích nhất(가장 좋아하다) · đặc sản(특산물) · rau thơm(향채) · nước chấm(찍어 먹는 소스) · phòng riêng(개별 룸) · nhân viên phục vụ(종업원). 음식: chả giò(짜조) · gỏi cá(생선회 무침) · bánh xèo(반쎄오) · lẩu cua(게 전골) · lẩu hải sản(해물 전골) · cơm sen(연잎밥) · nước mắm(느억맘, 생선 액젓)." },
  ]},
  34: { name:"여행·호텔 · 위치·방향 말 · vẫn·có·… hơn …", items:[
    { t:"trên, dưới, trong, ngoài, trước, sau (위치를 가리키는 말)", d:"명사 **앞**에 놓여 어디에 있는지를 알려 줘요. trên(위) · dưới(아래) · trong(안) · ngoài(밖) · trước(앞) · sau(뒤). 예: Cuốn sách ở **trên** bàn. (책이 책상 위에 있어요) · Cô ấy đang ngồi **trên** xe. (그녀는 차에 타고 있어요) ⚠️ 이 말들은 **명사**로도 써요. 뒤에 명사를 붙이지 않고 혼자 서서 앞자리·뒷자리처럼 자리를 가리켜요. 예: (Trên xe hơi) Anh tài xế ngồi ở **trước**, ông giám đốc ngồi ở **sau**. · (Chị lấy cái áo nào?) Tôi lấy cái **trong**. Tôi không thích cái **ngoài**. · Chị Lan đi **trước**, cô Hoa đi **sau**. 교재 24쪽 그림에는 giữa(가운데) · bên cạnh(옆) · chung quanh, xung quanh(둘레·주변)도 같이 나와요." },
    { t:"ra, vào, lên, xuống (방향을 가리키는 말)", d:"움직이는 **방향**이나 도착점을 나타내요. 다른 동사 뒤에 오면 전치사처럼 쓰여요. 어느 것을 쓸지는 **말하는 사람이 어디에서 보느냐**에 따라 달라져요. 예: Chị Lan (đi) **ra** chợ mua thức ăn. (집에서 시장 쪽으로 나갈 때) · Chị Lan (đi) **vào** chợ mua thức ăn. (길가나 시장 앞에서 시장 안으로 들어갈 때) · Thầy giáo viết từ mới **lên** bảng, sau đó sinh viên viết **vào** vở. · Con mèo nhảy **xuống** ghế. (책상 위나 창틀에서 내려올 때) · Con mèo nhảy **lên** ghế. (바닥에서 올라갈 때) ⚠️ 꼭 구별하세요: Nam để cuốn sách **lên** bàn.은 **움직인 방향**을 말하고, Nam để cuốn sách **trên** bàn.은 **놓여 있는 자리**를 말해요. 지도 위에서도 같은 말을 써요. 호찌민시에서 볼 때 북쪽이나 바깥·섬으로 가면 **ra**(ra Huế, ra Đà Nẵng, ra Phú Quốc), 안쪽·남쪽 도시로 들어가면 **vào**(vào Thành phố Hồ Chí Minh), 높은 고원으로 오르면 **lên**(lên Đà Lạt), 메콩 델타로 내려가면 **xuống**(xuống Miền Tây)." },
    { t:"vẫn (여전히, 변함없이)", d:"동사·형용사(때로는 명사) **앞**에 놓여 예전과 **달라지지 않았다**는 뜻을 더해요. 예: Trước đây anh ấy thích đi biển. Bây giờ anh ấy **vẫn** thích đi biển. · Bố tôi năm nay 80 tuổi nhưng **vẫn** khỏe mạnh. · (Chúng ta gặp nhau ở đâu?) **Vẫn** chỗ cũ nhé! (늘 만나던 그 자리에서요!) 교재 대화에도 나와요: Đối với tôi, Phú Quốc **vẫn** là số một. · Phú Quốc **vẫn** đẹp như hai năm trước." },
    { t:"có (있다, 그리고 정말 그랬다를 분명히 하는 말)", d:"먼저 **있다**는 뜻이에요. 예: **Có** một cuốn sách trên bàn. · Trong phòng **có** hai người. 동사·형용사 앞에 붙으면 그 일이 **실제로 있었다·그렇다**는 것을 분명히 해 줘요. 예: Hôm qua anh ấy **có** đưa cho tôi cái chìa khóa phòng này. · Chủ nhật cô ấy **có** ở nhà. · Hồi nãy tôi **có** hơi buồn, nhưng bây giờ thì vui rồi. ⚠️ **지난 일**을 묻고 답할 때 có는 **반드시** 넣어요. (Hôm qua anh **có** đi học không? / **Có**, tôi **có** đi. 또는 Không, tôi không **có** đi (học).) **앞으로의 일**을 물을 때는 넣어도 되고 빼도 돼요. (Ngày mai anh **có** đi học không? / **Có**, tôi **có** đi học. 또는 Không, tôi không **có** đi học.) (Ngày mai anh đi học không? / Đi, tôi đi. 또는 Không, tôi không đi.)" },
    { t:"… hơn … (~보다 더)", d:"둘을 견주어 **~보다 더 ~하다**라고 말할 때 써요. 「A + 형용사/동사 + **hơn** + B」 차례예요. 반대쪽은 **kém**, **thua**(~보다 못하다)예요. 다른 서술어 뒤에 오면 부사처럼 **더**라는 뜻이 돼요. 예: Về kỹ năng Nói thì Nam **hơn** Lan, nhưng về kỹ năng Nghe thì Lan **hơn** Nam. · Xe hơi chạy nhanh **hơn** xe máy. · **So với** xe máy **thì** xe hơi an toàn **hơn**. (오토바이와 비교하면 자동차가 더 안전해요) 셋 이상에서 **가장** ~한 것은 **nhất**을 써요. 예: Bức ảnh đẹp **nhất** của tôi đấy! · Đối với tôi, Phú Quốc vẫn là **số một**." },
    { t:"호텔·여행에서 쓰는 말 정리", d:"đặt phòng(방을 예약하다) · phòng đơn(1인실) · phòng đôi(2인실) · tiếp tân(프런트 직원) · hộ chiếu(여권) · cho mượn(빌려주다) · kiểm tra(확인하다) · tầng 5, phòng 512(5층 512호) · thang máy(엘리베이터) · đằng kia(저쪽) · phục vụ bữa sáng(아침 식사를 제공하다) · miễn phí(무료) · gửi chìa khóa phòng(방 열쇠를 맡기다) · làm ơn ... giùm tôi(~ 좀 해 주세요) · mất bao lâu?(얼마나 걸려요?) · khoảng 10 phút(10분쯤) · đối diện(맞은편) · nổi tiếng(유명하다) · đặc sản(특산 요리) · đi du lịch về(여행에서 돌아오다) · bãi biển(해변) · hồ bơi(수영장) · chợ đêm(야시장) · hải sản(해산물) · tươi(싱싱하다) · có lẽ(아마) · tất nhiên(당연히) · đối với tôi(나에게는) · so với(~와 비교하면)." },
  ]},
  35: { name:"쇼핑·흥정 · 세는 말 · không…đâu · chỉ…thôi · không những…mà còn", items:[
    { t:"danh từ đơn vị (물건을 세는 말)", d:"베트남어는 수를 셀 때 「숫자 + **세는 말** + 명사」 차례로 말해요. 한국어의 '한 **권**', '두 **마리**'와 같은 자리예요. ① 흔히 loại từ라고 부르는 것 : **cái**(물건 전반) · **con**(짐승) · **cuốn·quyển**(책) · **bức·tấm**(그림·사진) · **tờ**(종이·지폐) · **chiếc**(한 짝) · **đôi**(한 켤레·한 쌍) 등. 예: Cô ấy cho tôi một **trái** xoài. · Trên bàn có ba **quyển** sách. · **Bức** ảnh này chụp ở Phú Quốc. ② 단위(무게·길이) : **kí, tấn, tạ, lạng, lít, mét** 등. 예: Tôi mua một **kí** thịt bò. · Anh ấy cao 1,8**m**(một **mét** tám). ③ 원래 덩어리를 가리키던 말이 세는 말로 쓰이는 것 : **lá, trái, cây, chai, ly, chén, tô** 등. 예: Ở trên bàn có hai **cây** bút. · Tôi đã uống hai **chai** bia. 교재 29쪽 그림에 짝이 정리되어 있어요: **bức** tranh · **quyển** từ điển · **viên** kẹo · **tờ** 100 ngàn đồng · **con** cá · **hộp** sô cô la · **quả** chanh · **cây** bút · **đôi** đũa · **con** dao · **miếng** thịt · **bó** hoa · **chiếc** giày." },
    { t:"세는 말을 언제 넣고 언제 빼나 (danh từ đơn vị / danh từ khối)", d:"⚠️ 같은 낱말이라도 **덩어리 이름**으로 쓸 때와 **세는 말**로 쓸 때가 달라요. 예: Chị ấy mua hai cái **đĩa** này ở siêu thị.(접시라는 물건 자체 = danh từ khối) · Anh ấy ăn một **đĩa** cơm sườn.(한 접시만큼 = danh từ đơn vị) 넣어야 하는 자리는 두 군데예요. ① 숫자나 수량을 나타내는 말(1, 2, 3…, những, các, mấy, mọi, mỗi, từng) **뒤**, 그리고 어느 것인지 딱 집어 말할 때. 예: Cô ấy đã mua cho tôi ba **ổ** bánh mì. · **Những món** này rất ngon. ② 어느 것인지 정해진 것을 가리키는 덩어리 안. 예: Tôi thích **bức** tranh này. · Tôi đã gặp **cô** sinh viên giỏi nhất. · Tôi đã đọc **cuốn** sách ông ấy viết. 반대로 그냥 종류를 말할 때는 안 넣어요. 예: Anh ấy xuống căng tin mua **sinh tố** cho các bạn.(잔 수를 말하는 게 아님) · Bà Năm chưa gọi **điện thoại** cho bà Ba." },
    { t:"… không X đâu! (X 아니에요!)", d:"상대가 생각하거나 바라는 것을 **아니라고 되받는** 말이에요. 뜻은 'X 아니에요, 당신 생각과 달라요'. X는 상대가 말하거나 하려는 것, 또는 상대가 그렇게 생각한다고 내가 여기는 것이에요. 예: (Cái áo dài màu xanh rẻ quá, chỉ có 500 ngàn đồng.) Cái áo đó **không** rẻ **đâu**! // 500 ngàn thì **không** rẻ **đâu**. · (Cái áo dài đó đẹp quá!) Màu xanh **không** hợp với em **đâu**!(상대가 '나한테 어울리니까 사라'는 뜻으로 말했다고 보고 되받는 것) 교재 대화에도 나와요: Không mắc **đâu**! · Một triệu thì **không** được **đâu**. · Ở đây **không** nói thách **đâu**, anh!" },
    { t:"chỉ X / X thôi (X뿐이에요)", d:"**chỉ X**는 'X보다 많지 않다', 즉 'X 정도이고 그건 적다·작다'는 뜻이에요. chỉ는 서술어 앞에, 가끔은 명사 앞에 놓여요. **X thôi**는 문장(또는 서술부) 끝에 붙어 'X 말고는 더 없다'는 뜻이에요. 그래서 **chỉ**와 **thôi**는 따로 써도 되고(chỉ X / X thôi) 같이 써도 돼요(chỉ X thôi). 예: Ở Việt Nam tôi **chỉ** đi xe buýt (**thôi**). · Ông ấy uống **chỉ** 3 ly bia (**thôi**). · **Chỉ có** anh ấy làm được việc này (**thôi**). ⚠️ 마지막 형태에서는 **có**를 반드시 넣어요. 교재 대화에도 나와요: Khi đến Việt Nam, tôi **chỉ** mang theo áo thun **thôi**." },
    { t:"không những X mà (…) còn Y (nữa) (X뿐만 아니라 Y까지)", d:"'X인데 게다가 Y까지'라는 뜻이에요. Y는 보통 **듣는 사람이 미처 생각하지 못한** 것이에요. mà 뒤에 주어를 다시 넣어도 되고 안 넣어도 돼요. 예: Cô ấy **không những** học giỏi **mà còn** tốt bụng nên ai cũng thích. · **Không những** học giỏi **mà** cô ấy **còn** tốt bụng nên ai cũng thích. **không những … mà còn …** 자리에 **không chỉ … mà còn …**을 써도 같은 뜻이에요. 교재 대화·지문에도 나와요: **Không những** đẹp **mà còn** tốt **nữa**. · Nó **không những** rất 'mốt' **mà còn** bền **nữa**. · Hàng hóa ở đây **không những** đẹp **mà còn** đặc biệt." },
    { t:"… đây! (여기 있어요! / 이러겠는데요!)", d:"명사 덩어리 끝에 붙어 **'바로 여기, 바로 지금'**이라는 느낌을 줘요. 물건을 건네거나 무언가를 소개할 때 자주 써요. 예: **Đây**! Tiền của anh **đây**! · Cuốn sách cô ấy tặng tôi hôm sinh nhật **đây**! 사람을 바로 소개할 때는 này 대신 đây를 써요. 예: Xin giới thiệu với chị, anh Nam **đây** là giám đốc của chúng tôi. 문장 끝에 붙으면 **말한 바로 뒤에 일어날 일**을 알려요. 예: Chào anh. Tôi đi **đây**! · Tôi sẽ đến ngay **đây**! 또 **낌새를 보고 곧 그렇게 되겠다·방금 그렇게 됐다**고 짐작할 때도 써요. 예: Mây đen nhiều quá! Mưa to lắm **đây**! · (Anh Nam sẽ đến dự tiệc với chúng ta.) Ồ, có anh Nam thì sẽ vui lắm **đây**! · (Thấy bé Tèo mắt sưng, quần áo rách) Nó đánh nhau với bạn nữa **đây**!" },
    { t:"V + lại (다시 ~하다)", d:"동사 뒤에 **lại**를 붙이면 그 행동을 **한 번 더** 한다는 뜻이에요. 일부러 다시 하는 것이라 실수를 고치거나 확인할 때 자주 써요. 예: Tôi đang xem **lại** phim Forrest Gump. · Bức thư này anh viết khó đọc quá. Anh viết **lại** (bức thư này) đi! · Xin lỗi, tôi chưa nghe anh nói gì. Xin anh nói **lại**. · Anh định chuyển công ty à? Anh nên suy nghĩ **lại**. 교재 대화에도 나와요: Đây, anh xem **lại** đi!" },
    { t:"쇼핑·흥정에서 쓰는 말 정리", d:"mua sắm(쇼핑하다) · trung tâm thương mại(쇼핑몰) · siêu thị(마트) · cửa hàng tiện lợi(편의점) · chương trình khuyến mãi(판촉 행사) · mua một tặng một(하나 사면 하나 더) · hóa đơn(영수증) · giảm giá(할인하다) · miễn phí giao hàng(무료 배송) · giao hàng đến nhà(집까지 배달하다) · nói thách(값을 부풀려 부르다) · trả giá(값을 깎다) · bớt(깎아 주다) · mắc(비싸다, 남부말. 북부는 đắt) · rẻ(싸다) · bền(튼튼하다) · 'mốt'(유행) · sang trọng(고급스럽다) · hợp với(~에게 어울리다) · chất lượng(품질) · hàng thủ công(수공예품) · đồ gia dụng(생활용품) · tiền thối(거스름돈, 남부말) · một triệu rưỡi(150만) · quà khuyến mãi(사은품) · ly pha lê(크리스털 잔) · thưởng thức(맛보다) · thuận tiện(편하다) · tiện lợi(편리하다). 옷: áo sơ mi(셔츠) · áo thun(티셔츠) · áo đầm(원피스) · áo dài(아오자이) · quần tây(양복 바지) · quần jean(청바지) · bộ vest(정장) · giày(구두) · dép(샌들·슬리퍼) · khăn(수건) · cà vạt(넥타이) · dù(우산) · túi xách(가방) · đồng hồ(시계)." },
  ]},
  36: { name:"전화·배달 · càng…càng · tất cả·cả·đều · 얼마나 자주 하는지", items:[
    { t:"càng … càng … (~할수록 더 ~하다)", d:"두 가지가 **같이 늘어난다**는 뜻이에요. 앞이 늘면 뒤도 는다는 말이라, 한국어 '~할수록 더 ~하다'와 같아요. 두 가지 모양이 있어요. ① 주어가 둘일 때 「S1 **càng** 서술어1 (thì) S2 **càng** 서술어2」. 예: Chúng ta **càng** kiếm tiền nhiều thì gia đình **càng** sống tốt hơn. ② 주어가 하나일 때 「S **càng** 서술어1 (thì) **càng** 서술어2」 또는 「**Càng** 서술어1 (thì) S **càng** 서술어2」. 예: Anh **càng** chơi thể thao thì **càng** khỏe. ⚠️ càng은 **동사 앞**에 놓아도 되고 **정도를 나타내는 말 앞**에 놓아도 돼요. 예: Cha mẹ **càng** làm việc vất vả thì con cái **càng** học chăm chỉ. = Cha mẹ làm việc **càng** vất vả thì con cái học **càng** chăm chỉ. 말할 때는 뻔한 정도말을 빼기도 해요. 예: Cha mẹ **càng** làm việc thì con cái **càng** học chăm chỉ." },
    { t:"càng ngày càng … / càng lúc càng … (날이 갈수록 / 시간이 갈수록)", d:"늘어나는 것이 **시간**과 관련될 때 쓰는 짝이에요. **càng ngày càng**은 날 단위로 점점, **càng lúc càng**은 그 자리에서 점점 심해질 때 써요. 예: Tiếng Việt của tôi **càng ngày càng** tốt. (제 베트남어가 날이 갈수록 좋아져요) · Đứa bé sốt **càng lúc càng** cao. (아이 열이 시간이 갈수록 올라가요) 교재 대화에도 나와요: Sao tiền ship **càng ngày càng** cao vậy, em?" },
    { t:"tất cả … (전부, 모두)", d:"'하나도 빠짐없이 전부'라는 뜻이에요. 온전한 모양은 「**tất cả** + 수량말(những, các, mọi, mấy) 또는 숫자 + 세는 말 + 명사」예요. 예: **Tất cả** bốn con chó đó đều là của tôi. · Tôi đã đọc **tất cả** những cuốn sách thầy giáo yêu cầu. · **Tất cả** các bạn hãy cố gắng hơn nữa! **tất cả**는 명사 없이 혼자 서서 '그것 전부'를 가리키기도 해요. 예: Những cuốn sách thầy giáo yêu cầu, tôi đã đọc **tất cả**. · **Tất cả** là 500 ngàn đồng. 교재 대화에도 나와요: **Tất cả** bốn món chị đặt đây! · **Tất cả** muỗng đũa đều có trong túi." },
    { t:"cả … (통째로 전부)", d:"역시 '전부'인데 쓰임이 두 가지예요. ① 「**cả** + 숫자 + 세는 말 + 명사」. 예: Tôi quen với **cả** ba người đó. · **Cả** ba cuốn sách này đều khó đọc. ② 「**cả** + 세는 말 + 명사」로, 그 말이 **여러 부분으로 이루어진 덩어리**일 때. 예: Hôm qua **cả** lớp nghỉ học.(lớp = 여러 사람) · **Cả** nhà anh ấy đã đi Vũng Tàu.(nhà = 여러 사람) · Anh ấy đã đọc **cả** quyển sách.(책 = 여러 부분으로 나뉨) ⚠️ **tất cả**와 **cả**의 차이: Ông ấy đã viết **tất cả** 3 cuốn sách.는 '**합쳐서** 세 권'이라는 뜻이고, (Ông ấy viết 3 cuốn sách.) Tôi đã đọc **cả** 3 (cuốn).은 '**한 권도 빼지 않고** 세 권 다'라는 뜻이에요. cả도 동사 뒤에 혼자 설 수 있어요. 예: Hai con cá này, tôi mua **cả**. 교재 대화에도 나와요: **Cả** nhà chị đang đói meo. · Nếu chị đặt cơm **cả** tháng." },

const gramLessons = () => Object.keys(GRAMMAR).map(Number).sort((a,b)=>a-b);
/* 설명 속 **강조**를 굵게. esc()로 먼저 안전하게 바꾼 뒤에 ** 만 태그로 → 태그 주입 걱정 없음.
   (그동안 별표가 화면에 그대로 보였음) */
function gramMd(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"); }
function goGrammar(){ renderGrammar(); }
function renderGrammar(){
  let L = Number(lsGet("_gramL", 1));
  if(!GRAMMAR[L]) L = gramLessons()[0];
  state.screen = "grammar:"+L;
  const g = GRAMMAR[L];
  /* 칩 차례 : 교재2권(33~44) 먼저. 위 기본값 고르기(gramLessons()[0])는 원래 차례 그대로 둠 */
  const chips = byPickOrder(gramLessons()).map(l=>
    /* 교재2(33과~)가 들어오면서 "33과"라고만 쓰면 무슨 단원인지 알 수 없음 → 지문 해석 화면처럼 단원 이름을 그대로 씀 */
    `<button class="chip${l===L?" on":""}" data-action="gramLesson" data-l="${l}">${esc(lessonName(l))}</button>`
  ).join("");
  const cards = g.items.map(it=>`
    <div class="gcard">
      <div class="gt">${esc(it.t)}</div>
      <div class="gd">${gramMd(it.d)}</div>
    </div>`).join("");
  set(`
    <button class="link" data-action="goHome">← 처음으로</button>
    <div class="card">
      <h2><svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><use href='#i-bulb'/></svg> 문법 정리</h2>
      <div class="muted tiny" style="margin:-4px 0 10px">각 단원의 핵심 문법이에요. 교재 순서대로 훑어보세요.</div>
      <div class="chips gchips">${chips}</div>
      <div class="ghead">${esc(lessonName(L))} · ${esc(g.name)}</div>
      ${cards}
    </div>
    <button class="btn line" style="margin-top:10px" data-action="goHome"><svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><use href='#i-home'/></svg> 처음으로</button>
  `);
}

  33: { name:"식당·음식 · 7/31 수업 자료", note:"7월 31일 수업 슬라이드 9장과 칠판을 그대로 옮겨 담았어요. 선생님 자료는 **전부 하노이 말**입니다(bát, thìa, cốc, rán, rau mùi, nem rán, lạc rang). 반면 **교재2 1과는 남부 말**이라 같은 것을 chén, tô, chiên, ngò, chả giò 라고 부릅니다. **시험은 교재 기준**이니 맨 아래 대응표를 꼭 보고 가세요. 이 화면에 있는 말은 **단어 시험에 섞이지 않는 읽기 전용 자료**예요.", blocks:[
    { k:"pat", t:"CHỦ NGỮ + thế nào? (어때요?)", s:"수업 PPT", box:"A: 주어 + THẾ NÀO?\nB: 주어 + 형용사", lines:[
      { w:"A", vn:"Phở ở quán này thế nào?", ko:"이 가게 쌀국수는 어때요?" },
      { w:"B", vn:"Phở ở quán này không ngon lắm.", ko:"이 가게 쌀국수는 별로 맛있지 않아요." },
      { w:"A", vn:"Cà phê Việt Nam thế nào?", ko:"베트남 커피는 어때요?" },
      { w:"B", vn:"Cà phê Việt Nam ngon nhưng hơi đặc.", ko:"베트남 커피는 맛있는데 좀 진해요." },
    ], note:"선생님 메모: **đặc = strong** (진하다). 슬라이드 아래에 영어로 그렇게 적혀 있었어요. **đặc 은 앱 단어장에 없는 새 단어**입니다(비슷하게 생긴 đặc biệt, đặc sản 은 뜻이 달라요). 「A thế nào?」 는 '어때요?' 하고 물을 때 쓰는 통짜 표현이고, 대답에는 물음표 자리에 형용사만 넣으면 됩니다. **không ... lắm** 은 '별로 ~하지 않다', **nhưng** 은 '~인데' 예요." },
    { k:"pat", t:"Cho tôi ... (~ 주세요)", s:"수업 PPT", box:"A: 주어 + DÙNG GÌ?\nB: CHO TÔI + 주문할 것", lines:[
      { w:"A", vn:"Chị dùng gì?", ko:"누님, 뭐 드시겠어요?" },
      { w:"B", vn:"Cho tôi một phở gà không hành, mùi.", ko:"닭고기 쌀국수 하나 주세요. 파랑 고수는 빼고요." },
      { w:"A", vn:"Anh dùng gì?", ko:"형님, 뭐 드시겠어요?" },
      { w:"B", vn:"Cho một cà phê sữa, không đường, ít đá.", ko:"연유 커피 하나 주세요. 설탕 빼고 얼음은 조금만요." },
    ], note:"**dùng** 은 ăn·uống 을 높여 부르는 말이라 식당에서 손님에게 이렇게 묻습니다(Expats 생활용품 단어 '사용하다'와 같은 말이에요). 주문은 **Cho tôi + 개수 + 음식** 이 기본이고, 급하면 tôi 를 빼고 **Cho một ...** 이라고도 해요. 뒤에 **không + 재료**(그거 빼고), **ít + 재료**(그거 조금), **nhiều + 재료**(그거 많이) 를 붙이면 됩니다." },
    { k:"voc", t:"주문할 때 붙이는 말 (수업 PPT 낱말 상자)", s:"수업 PPT", rows:[
      ["không","빼고, 넣지 말고 (no)"],
      ["nhiều","많이 (much)"],
      ["ít","조금만 (little)"],
      ["đường","설탕 (교재2 1과 단어)"],
      ["đá","얼음 (교재1 6과 단어)"],
      ["sữa","우유, 연유 (교재1 6과 단어)"],
      ["hành","파 ('음식·요리' 단어)"],
      ["tỏi","마늘 (교재2 1과 단어)"],
      ["rau mùi","고수 (교재는 남부 말 ngò)"],
      ["muối","소금 (앱에 없는 새 단어)"],
      ["chanh","라임, 레몬 (교재2 1과 단어)"],
      ["dấm","식초 (앱에 없는 새 단어)"],
      ["ớt","고추 (교재2 1과 단어)"],
      ["tiêu","후추 (앱에 없는 뜻)"],
      ["giấy ăn","냅킨 (앱에 없는 새 단어)"],
      ["tăm","이쑤시개 (앱에 없는 새 단어)"],
    ], note:"앞의 세 개(không, nhiều, ít)는 재료가 아니라 **양을 조절하는 말**이라 재료 앞에 붙입니다. không hành(파 빼고), ít đá(얼음 조금), nhiều đường(설탕 많이) 처럼요. **rau mùi 가 하노이 말**이고 교재2 1과에는 남부 말 **ngò** 로 나옵니다. **tiêu 는 조심하세요.** 앱 단어장의 tiêu 는 '필수 동사' 묶음에 있는 '(돈을) 쓰다' 라서 **글자만 같고 뜻이 다른 말**입니다." },
    { k:"pat", t:"식당에서 자주 쓰는 말 8가지", s:"수업 PPT", box:"직원을 부를 때: EM ƠI!\n주문할 때: CHO TÔI + 원하는 것", lines:[
      { vn:"Em ơi!", ko:"저기요! (직원을 부를 때)" },
      { vn:"Anh dùng gì ạ?", ko:"손님, 뭐 드시겠어요? (직원이 묻는 말)" },
      { vn:"Anh chị gọi gì nữa không ạ?", ko:"더 주문하실 것 있으세요?" },

      { vn:"Cho tôi thực đơn.", ko:"메뉴판 주세요. (thực đơn 이 menu 의 베트남 말)" },

      { vn:"Bao nhiêu tiền? Tính tiền.", ko:"얼마예요? 계산해 주세요. (tính tiền 은 교재2 1과 단어)" },
      { vn:"Đóng gói mang về.", ko:"포장해 주세요. 가져갈게요." },
    ], note:"슬라이드 옆에 **CHO** 한 글자만 크게 적혀 있었어요. cho 는 원래 '주다' 인데, 식당에서는 **Cho tôi ...** 를 한 덩어리로 '~ 주세요' 라고 씁니다. **ơi** 는 사람을 부르는 말이라 상대 나이에 맞춰 em ơi, anh ơi, chị ơi 로 바꿔 부르면 돼요. **ạ** 는 문장 끝에 붙이는 공손 표시입니다. **menu, thực đơn, đóng gói, mang về 는 앱 단어장에 없는 새 말**이에요." },
    { k:"txt", t:"칠판 정리 · 말 순서를 뒤집으면 뜻이 바뀐다", s:"수업 칠판", body:"선생님이 칠판에 화살표로 뒤집어 보여 주신 부분이에요.\n\n**luộc rau** 는 '채소를 삶다' 입니다. 동사(luộc) + 목적어(rau) 순서예요. 이걸 뒤집어서 **rau luộc** 이라고 하면 '삶은 채소', 즉 **음식 이름**이 됩니다.\n\n**Mẹ rán trứng.** 은 '엄마가 계란을 부친다' 이고, 뒤집은 **trứng rán** 은 '계란 부침' 이라는 음식이에요. 그래서 **Em ăn trứng rán.** 은 '나는 계란 부침을 먹는다' 가 됩니다.\n\n정리하면 이렇습니다. **조리법이 앞에 오면 '~하다'(동작), 재료가 앞에 오면 '~한 것'(음식 이름)** 이에요. 베트남어는 꾸미는 말이 뒤에 붙기 때문입니다.\n\n칠판 한쪽에는 냄비 그림과 함께 **nấu** 와 **làm** 이 묶여 있었어요. 둘 다 '필수 동사' 단어이고, nấu 는 불에 올려 끓이고 익히는 쪽, làm 은 만드는 것 전체를 가리킵니다.\n\n**sô-cô-la** 는 초콜릿, **nước chấm** 은 찍어 먹는 소스(교재2 1과 단어)예요.\n\n맨 아래 문장은 **Người Việt Nam uống bia với lạc rang.** (베트남 사람은 볶은 땅콩을 안주 삼아 맥주를 마신다) 입니다. 여기 **lạc rang** 도 같은 규칙이에요. lạc(땅콩) 뒤에 rang(볶다)이 붙어서 '볶은 땅콩'이 됐습니다. **lạc 은 하노이 말**이고 호치민에서는 đậu phộng 이라고 해요. 둘 다 앱에는 아직 없는 단어입니다." },
    { k:"voc", t:"음식 이름 11가지", s:"수업 PPT", rows:[

    { k:"voc", t:"ĐỒ ĂN (먹을거리) 13가지", s:"수업 PPT", rows:[

    { k:"voc", t:"조리법 7가지", s:"수업 PPT", rows:[

      ["Quay","통째로 돌려 가며 굽다 (앱에 없는 뜻)"],

    { k:"voc", t:"식기·그릇 11가지", s:"수업 PPT", rows:[

/* =========================================================
   단어 연습 (예전 이름: 시험 대비) : 간격 반복 + 생산형(한→베) 연습
   · 단어마다 숙련도 0~3(3=마스터). 맞히면 +1, 틀리면 0 → 약한 단어에 시간이 저절로 몰림.
   · 진도(_srs)는 각자 폰에 저장(개인). 단어 자체는 코드라 동기 전원 공유.
   · 2026-08-01 1200단어 시험이 끝나서 D-day 표시와 '8/1 시험 범위' 칩은 뺐음.
     다음 시험이 잡히면 CLAUDE.md 5번 항목에 적어 둔 코드(PREP_EXAM/prepDaysLeft/prepDlabel)를
     그대로 되살리고, 화면 이름을 '시험 대비'로 되돌리면 됨.
   ========================================================= */
const SRS_MAX = 3;                        // 3번 연속 맞히면 '마스터'
const srsKey = w => w.lesson + "|" + normTone(w.vn);
const srsAll = () => lsGet("_srs", {}) || {};
const srsLv = w => Number(srsAll()[srsKey(w)] || 0);
function srsRec(w, ok){
  const a = srsAll(), k = srsKey(w), cur = Number(a[k]||0);
  const lv = ok ? Math.min(SRS_MAX, cur+1) : 0;
  if(lv>0) a[k]=lv; else delete a[k];
  lsSet("_srs", a);
}
const prepDeck = () => WORDS;                         // 전체 단어장(교재1권 + Expats + 교재2권 + 내 단어)
/* 공부 범위 : 단어 연습(한 단어씩 써내는 연습)에서 어느 단원까지 낼지.
   비어 있으면 = 전체. 고른 범위는 문제 출제·위 진도 숫자·홈 배너에 모두 적용됨(리스트 뽑기는 따로 고름). */
const PREP_PICK = new Set(lsGet("_prepPick", []) || []);
function prepPickSave(){ lsSet("_prepPick", [...PREP_PICK]); }
function prepPool(){ return PREP_PICK.size ? WORDS.filter(w=>PREP_PICK.has(w.lesson)) : WORDS; }
/* 교재 묶음의 단원 번호 : 단어 연습 '공부 범위'(prepRange), 단어 리스트 '빠른 선택'(plBundle),
   시험지·단어 연습 범위 고르기(selBundle) 세 곳이 같이 씀. 단원이 늘면 여기만 고치면 됨. */
const PREP_RANGES = { t1:[1,12], ex:[15,26], th:[27,32], t2:[33,44] };   // 교재1권 · Expats · 흔한어휘 · 교재2권
const inBook2 = l => typeof l==="number" && l>=33 && l<=44;
function prepRangeLessons(g){                          // g="all"이면 빈 배열(= 전체)
  const ls = lessonsList();
  if(g==="all") return [];
  const R = PREP_RANGES[g];
  return R ? ls.filter(l=>typeof l==="number" && l>=R[0] && l<=R[1]) : [];
}
function prepRangeCount(g){
  const ls = prepRangeLessons(g);
  return ls.length ? WORDS.filter(w=>ls.indexOf(w.lesson)>=0).length : WORDS.length;
}
function prepRangeIs(g){                               // 지금 고른 범위가 이 묶음인가(칩 강조용)
  const ls = prepRangeLessons(g);
  if(!ls.length) return PREP_PICK.size===0;
  return PREP_PICK.size===ls.length && ls.every(l=>PREP_PICK.has(l));
}
/* 8/1 시험이 끝나서 '8/1 시험 범위' 칩을 없앴는데, 그 범위가 폰에 저장된 채로 남아 있으면
   교재2권(33~44과) 단어가 영영 안 나오는데 고를 칩도 없어서 빠져나갈 수가 없음.
   그래서 딱 한 번, 저장된 범위가 그 시험 범위와 정확히 같을 때만 '전체'로 풀어 줌.
   (직접 고른 다른 범위는 건드리지 않음. _prepExamOff 가 이미 한 번 했다는 표시) */
function prepExamRangeRelease(){
  try{
    if(lsGet("_prepExamOff", false) === true) return;
    lsSet("_prepExamOff", true);
    if(!PREP_PICK.size) return;
    const old = lessonsList().filter(l=>!inBook2(l));
    if(PREP_PICK.size === old.length && old.every(l=>PREP_PICK.has(l))){
      PREP_PICK.clear(); prepPickSave();
    }
  }catch(e){}
}
const prepCounts = () => { const d=prepPool(); let m=0,f=0,z=0;
  d.forEach(w=>{ const l=srsLv(w); if(l>=SRS_MAX) m++; else if(l>0) f++; else z++; });
  return { total:d.length, master:m, familiar:f, fresh:z }; };

const PREP = { queue:[], idx:0, typed:"", graded:false, res:"", correct:0, leveled:0, sessN:50, gradedAt:0 };
/* 이어서 풀기 — 세션(문제 목록 + 지금 위치)을 저장해 중간에 멈춰도 나중에 이어서 함. 단어는 srsKey로 저장/복원. */
function prepSessSave(){
  try{
    if(PREP.idx<=0 || PREP.idx>=PREP.queue.length){ return; }   // 시작 직후·완료면 저장 안 함
    lsSet("_prepsess", { keys: PREP.queue.map(srsKey), idx: PREP.idx, correct: PREP.correct, leveled: PREP.leveled });
  }catch(e){}
}
function prepSessClear(){ lsSet("_prepsess", null); }
function prepSessLoad(){
  const s = lsGet("_prepsess", null);
  if(!s || !Array.isArray(s.keys) || !s.keys.length) return null;
  const byKey = {}; prepDeck().forEach(w=>{ byKey[srsKey(w)] = w; });
  const queue = s.keys.map(k=>byKey[k]).filter(Boolean);
  const idx = Math.min(Number(s.idx)||0, queue.length);
  if(!queue.length || idx<=0 || idx>=queue.length) return null;   // 남은 문제가 없으면 무효
  return { queue, idx, correct:Number(s.correct)||0, leveled:Number(s.leveled)||0, total:queue.length };
}

/* =========================================================
   단어 연습 · 단어 리스트 (필기용 · 인쇄용)
   한 단어씩 타자로 치는 연습과 '별개로', 베트남어와 뜻을 한눈에 늘어놓고
   보면서 공책에 옮겨 적을 수 있는 화면. 그대로 A4 인쇄도 됨(동기들 나눠주기용).
   ⚠️ 화면 조작 부분은 전부 .noprint 안에 둬야 인쇄물에 안 딸려 나감.
   ========================================================= */
const PL = {
  pick : new Set(),                                  // 비어 있으면 = 전체 단원
  only : lsGet("_plOnly", "all") === "weak" ? "weak" : "all",   // all | weak(아직 못 외운 것만)
  order: lsGet("_plOrder","book") === "shuffle" ? "shuffle" : "book",
  cols : [1,2,3].indexOf(Number(lsGet("_plCols",2)))>=0 ? Number(lsGet("_plCols",2)) : 2,
  group: lsGet("_plGroup", true) !== false          // 단원 이름을 중간에 끼워 넣기
};
let PL_CACHE = { key:"", list:[] };                  // '섞기'가 화면 다시 그릴 때마다 뒤바뀌지 않게 보관
function plWords(){
  let a = prepDeck();
  if(PL.pick.size) a = a.filter(w=>PL.pick.has(w.lesson));
  if(PL.only==="weak") a = a.filter(w=>srsLv(w)<SRS_MAX);
  if(PL.order!=="shuffle") return a;
  const k = [...PL.pick].join(",")+"|"+PL.only+"|"+a.length;
  if(PL_CACHE.key !== k) PL_CACHE = { key:k, list:shuffle(a) };
  return PL_CACHE.list;
}
/* A4 몇 장쯤 될지 어림잡기(칸 수에 따라 한 장에 들어가는 줄 수가 달라짐).
   실제 장수는 기기·브라우저마다 조금 다를 수 있어서 '약'으로 보여줌. */
function plPages(n){ const per = PL.cols===1 ? 33 : PL.cols===2 ? 78 : 130;   // 크롬으로 실제 인쇄해 재본 값(조금 넉넉하게 잡음)
                     return Math.max(1, Math.ceil(n/per)); }
function plRangeLabel(){
  if(!PL.pick.size) return "전체 단원";

function prepStart(){
  const deck = prepPool();                            // 고른 공부 범위 안에서만 출제
  if(!deck.length){ alert("먼저 단어가 있어야 해요."); return; }
  prepSessClear();                                    // 처음부터 새로 = 저장된 세션 버림
  const weak = deck.filter(w=>srsLv(w)<SRS_MAX);
  const base = weak.length ? weak : deck.slice();     // 다 마스터했으면 전체에서 복습
  const byLevel = base.slice().sort((a,b)=>srsLv(a)-srsLv(b));   // 약한(낮은 숙련도) 우선
  PREP.queue = shuffle(byLevel.slice(0, Math.min(PREP.sessN, byLevel.length)));
  PREP.idx=0; PREP.typed=""; PREP.graded=false; PREP.res=""; PREP.correct=0; PREP.leveled=0; PREP.caseHint="";
  renderPrepQuiz();
}
function prepResume(){                                 // 이어서 풀기 — 저장된 세션 복원
  const s = prepSessLoad();
  if(!s){ prepStart(); return; }
  PREP.queue = s.queue; PREP.idx = s.idx; PREP.correct = s.correct; PREP.leveled = s.leveled;
  PREP.typed=""; PREP.graded=false; PREP.res=""; PREP.caseHint="";
  renderPrepQuiz();
}
function renderPrepQuiz(){
  const w = PREP.queue[PREP.idx];
  if(!w){ renderPrepDone(); return; }
  state.screen = "prepq:"+PREP.idx;
  const n = PREP.idx+1, tot = PREP.queue.length;
  const lvNow = srsLv(w);
  const dots = Array.from({length:SRS_MAX},(_,i)=>`<span class="pdot${i<lvNow?" on":""}"></span>`).join("");
  let body;
  if(!PREP.graded){
    body = `

      ${IS_MOBILE?"":`<div class="muted tiny" style="margin-top:8px;text-align:center">Enter 채점 · Esc 모르겠어요</div>`}`;
  } else {
    const ok = PREP.res==="ok";
    const badge = ok ? `<span class="pres good">✓ 정답</span>`
      : PREP.res==="tone" ? `<span class="pres warn">⚠ 성조가 달라요</span>`
      : PREP.caseHint ? `<span class="pres bad">✗ 대문자로 써야 해요</span>`
      : `<span class="pres bad">✗ 다시 나올 거예요</span>`;
    const mine = (PREP.typed && !ok) ? `<div class="muted tiny" style="margin-top:6px">내가 쓴 답: ${esc(PREP.typed)}</div>` : "";
    body = `
      <div class="prepans">
        ${badge}
        <div class="pavn">${esc(w.vn)} ${spkBtn(w.vn,"vi-VN",true)}${northTag(w.vn)}</div>
        ${w.eng?`<div class="muted tiny">${esc(w.eng)}</div>`:""}
        ${mine}
      </div>
      <button class="btn" style="width:100%;margin-top:12px" data-action="prepNext">${n>=tot?"결과 보기 →":"다음 →"}</button>
      ${IS_MOBILE?"":`<div class="muted tiny" style="margin-top:8px;text-align:center">Enter 로 다음 단어</div>`}`;
  }
  set(`
    <div class="quizbar"><div class="quizbar-in" style="width:${Math.round(n/tot*100)}%"></div></div>
    <div class="prephead"><span>${n} / ${tot}</span><span class="muted">맞은 개수 ${PREP.correct}</span></div>
    <div class="card">
      <div class="plesson">${esc(lessonLabel(w.lesson))} · 숙련도 <span class="pdots">${dots}</span></div>
      <div class="pprompt">${esc(w.en)}</div>
      ${body}
    </div>
    <button class="link" style="margin-top:10px" data-action="quitPrep">그만두기</button>
  `);
  const inp = document.getElementById("prepInput");   // 채점 전 화면에만 있음
  if(inp && !PREP.graded){
    inp.focus();
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.isComposing){ e.preventDefault(); prepGrade(); } });
  }
  // 채점 후 'Enter로 다음'은 전역 keydown(부팅부)에서 처리 — 입력칸 없이도 동작
}
function prepGrade(){
  if(PREP.graded) return;
  const inp = document.getElementById("prepInput");
  PREP.typed = inp ? inp.value.trim() : "";
  const w = PREP.queue[PREP.idx];
  const g = PREP.typed ? checkVnAny(w.en, w.vn, PREP.typed) : "no";
  PREP.res = g;
  PREP.caseHint = (g==="no") ? vnCaseHint(w.vn, PREP.typed) : "";   // 철자는 맞고 대문자만 틀림
  if(g==="ok"){ PREP.correct++; if(srsLv(w)<SRS_MAX) PREP.leveled++; srsRec(w,true); }
  else if(g==="tone"){ /* 성조만 틀림 = 마스터 진행 안 함(시험엔 성조 필요), 리셋도 안 함 */ }
  else { srsRec(w,false); }
  PREP.graded = true; PREP.gradedAt = Date.now();   // 채점 직후 반사적 Enter가 '다음'을 건너뛰지 않게(전역 keydown에서 가드)
  renderPrepQuiz();
}
function prepSkip(){
  if(PREP.graded) return;
  const w = PREP.queue[PREP.idx];
  PREP.typed=""; PREP.res="no"; PREP.caseHint=""; srsRec(w,false); PREP.graded=true; PREP.gradedAt = Date.now();
  renderPrepQuiz();
}
function prepNext(){
  PREP.idx++; PREP.typed=""; PREP.graded=false; PREP.res=""; PREP.caseHint="";
  if(PREP.idx>=PREP.queue.length){ prepSessClear(); renderPrepDone(); }   // 세션 완료 → 저장 세션 지움
  else { prepSessSave(); renderPrepQuiz(); }                              // 진행 상황 저장(이어서 풀기)
}

/* 읽기 화면 '단어 찾기' — 입력하면 몇 과 몇 번인지 + 뜻 + 발음 (화면 재생성 없이 결과만 갱신) */
/* 문장 안에서 그 낱말(구)이 '낱말 단위'로 나오는지.
   ① 부분일치가 아니라 낱말 일치 → 'đi'가 'điện' 안에 걸리는 오탐 방지.
   ② strict=true면 성조까지 비교 → 'đừng'(하지 마)이 이름 'Dung'에 걸리는 오탐 방지.
      성조까지로 하나도 못 찾으면 호출부에서 성조 무시로 한 번 더 찾음(성조 없이 타이핑해도 나오게). */
function sentHasTerm(sentVn, term, strict){
  const N = strict ? normTone : norm;
  const words = N(sentVn).split(" ").filter(Boolean);
  const t = N(term).split(" ").filter(Boolean);
  if(!t.length) return false;
  for(let i=0; i+t.length<=words.length; i++){
    let ok=true;
    for(let j=0;j<t.length;j++) if(words[i+j]!==t[j]){ ok=false; break; }
    if(ok) return true;
  }
  return false;
}
/* 찾은 낱말을 문장 안에서 굵게 */
function markTerms(vn, terms, strict){
  const N = strict ? normTone : norm;
  const set = new Set();
  terms.forEach(t=>N(t).split(" ").filter(Boolean).forEach(x=>set.add(x)));
  return vn.split(/(\s+)/).map(tok=>{
    const bare = N(tok);
    return (bare && set.has(bare)) ? `<b style="color:var(--brand)">${esc(tok)}</b>` : esc(tok);
  }).join("");
}
/* 검색어(또는 찾아진 단어)가 들어간 교재 문장·대화 줄 모으기 */
function findSentences(terms, limit, strict){
  const out=[], seen=new Set();
  const push=(vn,en,label)=>{
    const k=norm(vn); if(seen.has(k)) return; seen.add(k);
    out.push({vn,en,label});
  };
  for(const l of sentLessons()){
    for(const s of (SENT_BY_LESSON[l]||[])){
      if(out.length>=limit) return out;
      if(terms.some(t=>sentHasTerm(s.vn,t,strict))) push(s.vn, s.en, lessonLabel(l));
    }
  }
  for(const l of dialogLessons()){
    for(const d of (DIALOGS[l]||[])){
      for(const ln of d.lines){
        if(out.length>=limit) return out;
        if(terms.some(t=>sentHasTerm(ln.vn,t,strict))) push(ln.vn, ln.ko, lessonLabel(l)+" 대화"+d.no);
      }
    }
  }
  return out;
}
function bindFind(){
  const inp=document.getElementById("findInput"); if(!inp) return;
  const res=document.getElementById("findResults");
  const LIMIT=25;
  const render=()=>{
    const k=norm(inp.value);
    if(!k){ res.innerHTML=""; return; }   // 비어 있으면 결과창도 숨김(홈이 깔끔하게)
    // 베트남어 · 한국어 뜻 · 교재 영어 뜻(eng) 모두로 검색
    // 정확히 일치 → 그 말로 시작 → 포함 순으로 정렬 (안 그러면 'đi' 검색에 điện·đường이 37개 먼저 떠서
    //  아래의 '교재 문장'이 파묻힘)
    // 성조까지 맞는 것 → 성조 빼고 맞는 것 → 시작하는 것 → 포함하는 것
    // (성조를 안 보면 'đừng' 검색에 'đúng'(맞다)이 먼저 떠서 헷갈림)
    const kT=normTone(inp.value);
    const rank=w=>{
      const vT=normTone(w.vn);
      if(vT===kT) return 0;
      const n=northOf(w.vn);
      if(n && normTone(n)===kT) return 0;              // 하노이말로 찾아도 바로 위에
      const v=norm(w.vn), e=norm(w.en), g=w.eng?norm(w.eng):"";
      if(e===k||g===k) return 1;
      if(v===k) return 2;
      if(vT.startsWith(kT)) return 3;
      if(v.startsWith(k)||e.startsWith(k)||g.startsWith(k)) return 4;
      return 5;
    };
    // ⚠️ 낱말 '중간'에 걸리는 것 제외 — 낱말이 시작하는 자리에서만 일치로 봄.
    //   안 그러면 'đi'(성조 떼면 di)가 diligent 안에 걸려 chăm chỉ가, 'hả'(ha)가 chăm 안에 걸려 또 chăm chỉ가 나옴.
    //   (norm이 쉼표·괄호를 공백으로 바꿔주므로 공백 기준으로 나눠 비교)
    const startsHit=(text,q)=>{
      if(!text||!q) return false;
      const t=norm(text);
      if(q.includes(" ")) return t.startsWith(q) || t.includes(" "+q);   // 여러 낱말 검색 (ngân hàng)
      return t.split(" ").some(tok=>tok.startsWith(q));                  // 한 낱말 검색 (đi → đi học ○ / chăm ✗)
    };
    const engHit=w=>{
      if(!w.eng) return false;
      const t=" "+norm(w.eng)+" ";
      if(t.includes(" "+k+" ")) return true;           // 낱말 통째로 (bank → bank)
      return k.length>=4 && startsHit(w.eng, k);       // 4글자 이상이면 낱말 앞부분도 (teach → teacher)
    };
    const northHit=w=>{ const n=northOf(w.vn); return !!n && startsHit(n,k); };   // 하노이말(muộn)로 쳐도 교재 단어(trễ)가 나오게
    const all=WORDS.filter(w=>startsHit(w.vn,k)||startsHit(w.en,k)||engHit(w)||northHit(w))
                   .map(w=>({w,r:rank(w)})).sort((a,b)=>a.r-b.r).map(x=>x.w);
    const WMAX=8;
    const hits=all.slice(0,WMAX), more=all.length-hits.length;

    // 이 단어가 나오는 교재 문장 — 좁은 것부터 차례로 시도해서 엉뚱한 단어가 딸려오지 않게
    //  ① 입력 그대로 + 성조까지 정확히   (đừng → đúng/Dung 안 걸림, mới → mời 안 걸림)
    //  ② 없으면: 검색된 단어의 베트남어로 + 성조까지  (뜻·영어로 찾은 경우: 은행/bank → ngân hàng)
    //  ③ 그래도 없으면: 성조 무시로 완화  (성조 없이 타이핑한 경우: ngoai ngu → ngoại ngữ)
    const raw = inp.value.trim();
    const vns = [...new Set(hits.slice(0,6).map(w=>w.vn))];
    let terms=[raw], strict=true;
    let sents=findSentences(terms, LIMIT, true);
    if(!sents.length && vns.length){ terms=vns; sents=findSentences(terms, LIMIT, true); }
    if(!sents.length){ strict=false; terms=[raw, ...vns].filter(Boolean); sents=findSentences(terms, LIMIT, false); }

    const wordBlock = hits.length
      ? hits.map(w=>`<div style="display:flex;align-items:center;gap:8px;padding:7px 2px;border-top:1px solid var(--line)">
          <span style="flex:0 0 auto;font-size:12px;font-weight:700;color:var(--brand);background:var(--brandsoft);padding:2px 7px;border-radius:6px;white-space:nowrap">${esc(lessonLabel(w.lesson))}${w.num?" "+w.num+"번":""}</span>
          <span style="flex:1 1 38%;font-weight:700">${esc(w.vn)}${northTag(w.vn)}</span>
          <span style="flex:1 1 42%;color:var(--muted);font-size:13px">${esc(w.en)}${w.eng?`<span style="display:block;font-size:11.5px;opacity:.75">${esc(w.eng)}</span>`:""}</span>
          ${spkBtn(w.vn,"vi-VN",true)}
        </div>`).join("") + (more>0?`<div class="muted tiny" style="padding:6px 2px">비슷한 단어 ${more}개 더 있어요 — 더 정확히 입력해 보세요.</div>`:"")
      : `<div class="muted tiny" style="padding:6px 2px">'${esc(inp.value)}' 은(는) 단어장에 없어요. (교재 단어가 아닐 수 있어요)</div>`;

    const sentBlock = sents.length
      ? `<div style="margin-top:12px;border-top:2px solid var(--line);padding-top:9px">
          <div class="muted tiny" style="font-weight:800;margin-bottom:4px">
            <svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><use href='#i-book'/></svg>
            이 단어가 나오는 교재 문장 ${sents.length}${sents.length>=LIMIT?"+":""}개
          </div>
          ${sents.map(s=>`<div style="display:flex;align-items:flex-start;gap:8px;padding:7px 2px;border-top:1px solid var(--line)">
            <span style="flex:0 0 auto;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);padding:2px 6px;border-radius:6px;white-space:nowrap;margin-top:2px">${esc(s.label)}</span>
            <span style="flex:1;min-width:0">
              <span style="font-weight:600;line-height:1.45">${markTerms(s.vn, terms, strict)}</span>
              <span style="display:block;color:var(--muted);font-size:12.5px;margin-top:2px">${esc(s.en)}</span>
            </span>
            ${spkBtn(s.vn,"vi-VN",true)}
          </div>`).join("")}
        </div>`
      : (hits.length ? `<div class="muted tiny" style="margin-top:10px">교재 문장에는 아직 안 나와요.</div>` : "");

    res.innerHTML = wordBlock + sentBlock;
  };
  inp.addEventListener("input", render);
  render();
}
