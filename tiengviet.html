<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>베트남어 단어·문장 학습</title>
<meta name="description" content="단어·문장 공부 + 시험지 만들기">
<meta property="og:type" content="website">
<meta property="og:title" content="베트남어 단어·문장 학습">
<meta property="og:description" content="단어·문장 공부 + 시험지 만들기">
<meta property="og:url" content="https://chan026-normal.github.io/word-note/">
<meta property="og:site_name" content="베트남어 단어·문장 학습">
<meta property="og:locale" content="ko_KR">
<!-- 홈 화면 앱(PWA): 아이콘·전체화면 -->
<meta name="theme-color" content="#5f6fa6">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="베트남어 학습">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2430; --muted:#6b7280;
    --line:#e6e9f0; --brand:#5f6fa6; --brand2:#7482b3; --brandsoft:#eceef6;
    --good:#3f885d; --goodsoft:#eaf3ed; --bad:#bd574f; --badsoft:#f6edeb;
    --accent:#418379; --accentsoft:#e6f0ee; --warn:#9a6a00; --warnsoft:#fff6e0; --shadow:0 6px 22px rgba(31,36,48,.07);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1320; --card:#191f30; --ink:#eef1f8; --muted:#9aa3b5;
      --line:#2a3145; --brand:#707bb0; --brand2:#7d88bb; --brandsoft:#272e46;
      --good:#56ad7d; --goodsoft:#17301e; --bad:#d77d75; --badsoft:#352020;
      --accent:#4f9c90; --accentsoft:#173430; --warn:#e3b85a; --warnsoft:#322a12; --shadow:0 6px 22px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* 폰에서 화면을 아래로 당겼다 놓으면 브라우저가 '새로고침'을 해버려서
     풀던 문제·진행상황이 다 날아감 → 당겨서 새로고침을 끔(스크롤은 그대로 됨). */
  html,body{margin:0;padding:0; overscroll-behavior-y:contain}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",Segoe UI,Roboto,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    padding-bottom:40px;
  }
  .topbar{
    position:sticky; top:0; z-index:10; background:var(--card);
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;
    padding:12px 16px;
  }
  .brand{
    font-size:18px; font-weight:800; color:var(--ink); background:none; border:none;
    cursor:pointer; padding:0; display:flex; align-items:center; gap:8px;
  }
  .zoomctl{display:flex; align-items:center; gap:3px; margin-left:auto}
  .zoomctl button{border:1.5px solid var(--line); background:var(--card); color:var(--ink); height:28px; min-width:28px; padding:0; border-radius:8px; font-weight:800; font-size:16px; line-height:1; cursor:pointer}
  .zoomctl button:active{transform:scale(.93)}
  .zoomctl button#zoomLbl{min-width:auto; padding:0 8px; font-size:11px; font-weight:700; color:var(--muted)}
  .wrap{max-width:680px; margin:0 auto; padding:16px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:18px; margin-bottom:14px}
  h2{font-size:15px; margin:0 0 12px; color:var(--muted); font-weight:700; letter-spacing:.2px}
  .row{display:flex; flex-wrap:wrap; gap:8px}
  .chip{
    border:1.5px solid var(--line); background:var(--card); color:var(--ink);
    padding:8px 12px; border-radius:999px; font-size:14px; cursor:pointer; font-weight:600;
    transition:.12s; user-select:none;
  }
  .chip.on{background:var(--brandsoft); border-color:var(--brand); color:var(--brand)}
  .chip small{color:var(--muted); font-weight:500}
  .chip.on small{color:var(--brand)}
  .chip.mine{border-color:var(--accent); color:var(--accent)}
  .chip.mine.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .seg{display:flex; gap:8px; flex-wrap:wrap}
  .seg button{
    flex:1; min-width:96px; border:1.5px solid var(--line); background:var(--card);
    color:var(--ink); padding:12px 10px; border-radius:14px; font-size:14px; font-weight:700;
    cursor:pointer; transition:.12s;
  }
  .seg button.on{background:var(--brand); border-color:var(--brand); color:#fff}
  .seg .desc{display:block; font-size:11px; font-weight:500; opacity:.8; margin-top:2px}
  .btn{
    width:100%; border:none; border-radius:16px; padding:16px; font-size:17px; font-weight:800;
    background:var(--brand); color:#fff; cursor:pointer; transition:.12s;
  }
  .btn:active{transform:scale(.99)}
  .btn.lg{padding:18px}
  .btn.ghost{background:var(--brandsoft); color:var(--brand)}
  .btn.soft{background:var(--card); border:1.5px solid var(--line); color:var(--ink)}
  .btn.line{background:none; border:1.5px solid var(--line); color:var(--muted); font-weight:700}
  .btn2{display:flex; gap:10px}
  .btn2 .btn{font-size:15px; padding:14px}
  .muted{color:var(--muted)}
  .center{text-align:center}
  .stat{display:flex; gap:14px; justify-content:center; margin-bottom:6px}
  .stat b{font-size:22px}
  .tiny{font-size:12px}
  .link{background:none;border:none;color:var(--brand);font-weight:700;cursor:pointer;font-size:14px;padding:6px}

  /* quiz */
  .qtop{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; font-size:13px; font-weight:700; color:var(--muted)}
  .bar{height:8px; background:var(--line); border-radius:999px; overflow:hidden; margin-bottom:16px}
  .bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--brand),var(--brand2)); transition:width .25s}
  .dirtag{display:inline-block; font-size:12px; font-weight:700; color:var(--accent); background:color-mix(in srgb,var(--accent) 14%, transparent); padding:4px 10px; border-radius:999px; margin-bottom:14px}
  .prompt{font-size:34px; font-weight:800; text-align:center; margin:6px 0 4px; word-break:break-word; line-height:1.25}
  .prompt.sent{font-size:22px; line-height:1.4}
  .promptsub{text-align:center; color:var(--muted); font-size:13px; margin-bottom:18px}
  .opt{
    width:100%; text-align:left; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
    padding:15px 16px; border-radius:14px; font-size:16px; font-weight:600; cursor:pointer; margin-bottom:10px;
    display:flex; align-items:center; gap:10px; transition:.1s;
  }
  .opt .num{width:24px;height:24px;flex:0 0 24px;border-radius:7px;background:var(--brandsoft);color:var(--brand);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .opt.correct{background:var(--goodsoft); border-color:var(--good); color:var(--good)}
  .opt.correct .num{background:var(--good);color:#fff}
  .opt.wrong{background:var(--badsoft); border-color:var(--bad); color:var(--bad)}
  .opt.wrong .num{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  input.answer{
    width:100%; padding:15px 16px; border:1.5px solid var(--line); border-radius:14px; font-size:18px;
    background:var(--card); color:var(--ink); outline:none; text-align:center; font-weight:600;
  }
  input.answer:focus{border-color:var(--brand)}
  textarea.answer{width:100%; padding:14px 16px; border:1.5px solid var(--line); border-radius:14px; font-size:17px; background:var(--card); color:var(--ink); outline:none; font-weight:600; resize:vertical; line-height:1.4; font-family:inherit; box-sizing:border-box}
  textarea.answer:focus{border-color:var(--brand)}
  .mycmp{background:var(--brandsoft); color:var(--ink); border-radius:12px; padding:10px 14px; margin-top:12px; font-size:15px; line-height:1.45}
  .mycmp b{color:var(--brand); margin-right:6px; font-size:12px; font-weight:800}
  .feedback{border-radius:14px; padding:14px 16px; margin-top:14px; font-weight:700; font-size:15px}
  .feedback.ok{background:var(--goodsoft); color:var(--good)}
  .feedback.no{background:var(--badsoft); color:var(--bad)}
  .feedback .ans{display:block; color:var(--ink); font-weight:800; font-size:20px; margin-top:4px}
  .spk{border:none;background:var(--brandsoft);color:var(--brand);width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:17px;vertical-align:middle}
  .spk.sm{width:30px;height:30px;font-size:14px;border-radius:9px}

  /* 단어 순서 배치 (쓰기 → 문장 → 순서 배치) */
  .wline{min-height:52px; display:flex; flex-wrap:wrap; gap:7px; align-items:flex-start; align-content:flex-start;
    padding:11px; border-bottom:2px dashed var(--line); border-radius:10px; background:var(--bg)}
  .wpool{display:flex; flex-wrap:wrap; gap:7px; margin-top:14px}
  .wchip{border:1.5px solid var(--line); background:var(--card); color:var(--ink);
    padding:9px 13px; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; transition:.12s; box-shadow:0 1px 0 var(--line)}
  .wchip:active{transform:scale(.96)}
  .wchip.placed{border-color:var(--brand); background:var(--brandsoft); color:var(--brand); box-shadow:none}
  .wchip.used{visibility:hidden}
  .wchip:disabled{cursor:default}

  /* 대화 빈칸 채우기 (듣기) */
  .dplay{display:flex; gap:8px; padding:12px 14px}
  .dplay .btn{margin:0; flex:1}
  .dlg{padding:4px 14px}
  .dline{display:flex; gap:10px; padding:11px 0; border-top:1px solid var(--line); border-radius:10px; transition:background .2s}
  .dline:first-child{border-top:0}
  .dline.now{background:var(--brandsoft)}
  .dwho{flex:0 0 auto; min-width:58px; font-weight:800; font-size:13px; color:var(--brand); padding-top:6px}
  .dbody{flex:1; min-width:0}
  .dtext{line-height:2.2; font-size:16px; word-break:break-word}
  input.dblank{display:inline-block; border:0; border-bottom:2px solid var(--brand); background:transparent;
    font:inherit; font-size:15px; font-weight:700; color:var(--ink); text-align:center; padding:0 2px; outline:none; border-radius:0}
  input.dblank:focus{background:var(--brandsoft)}
  .dblank.done{display:inline-block; min-width:40px; text-align:center; padding:0 4px; font-weight:800; border-bottom:2px solid var(--line)}
  .dblank.done.ok{color:var(--good); border-bottom-color:var(--good)}
  .dblank.done.tone{color:var(--warn); border-bottom-color:var(--warn)}
  .dblank.done.no{color:var(--bad); border-bottom-color:var(--bad); text-decoration:line-through}
  .dans{display:inline-block; margin-left:5px; color:var(--good); font-weight:800; font-size:15px}
  .dbtns{display:flex; gap:6px; align-items:center; margin-top:5px}
  .chip.tiny{padding:4px 10px; font-size:12px}
  .dhint{margin-top:5px; font-size:13.5px; color:var(--muted); line-height:1.5}
  /* 대화 전부 받아쓰기 — 줄 통째로 입력 */
  textarea.dfull{width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:10px; font-size:15px;
    background:var(--card); color:var(--ink); outline:none; font-weight:600; resize:vertical; line-height:1.45;
    font-family:inherit; box-sizing:border-box}
  textarea.dfull:focus{border-color:var(--brand)}

  /* flashcard */
  .flash{
    perspective:1200px; height:240px; margin:8px 0 16px; cursor:pointer;
  }
  .flash-inner{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d}
  .flash.flipped .flash-inner{transform:rotateY(180deg)}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; border:1.5px solid var(--line);
    background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:16px;
  }
  .face .big{font-size:32px; font-weight:800; text-align:center; word-break:break-word}
  .face .lbl{font-size:12px; color:var(--muted); font-weight:700}
  .face.back{transform:rotateY(180deg); background:var(--brandsoft)}
  .face.back .big{color:var(--brand)}

  /* 홈 4영역 / 듣기 / 말하기 */
  .skillgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .skillcard{border:1.5px solid var(--line); background:var(--card); border-radius:18px; padding:15px; cursor:pointer; text-align:left; transition:.12s; display:flex; flex-direction:column; gap:5px; box-shadow:var(--shadow); color:var(--ink)}
  .skillcard:active{transform:scale(.985)}
  .skillcard .ic{font-size:28px; line-height:1}
  .skillcard .nm{font-size:17px; font-weight:800}
  .skillcard .ds{font-size:12px; color:var(--muted); line-height:1.45}
  .skillcard .tg{margin-top:3px; font-size:11px; font-weight:700; color:var(--brand); background:var(--brandsoft); padding:3px 9px; border-radius:999px; align-self:flex-start}
  /* 4영역 카드 — 색으로 구분하지 않고 아이콘·글자로만 (차분한 학습 톤) */
  .skillcard{box-shadow:none; border:1px solid var(--line)}
  .skillcard:active{background:var(--bg)}
  .skillcard .ic{color:var(--muted)}
  .skillcard .tg{color:var(--muted); background:var(--bg); font-weight:600}
  /* 홈 단어 검색바 */
  .hsearch{display:flex; align-items:center; gap:9px; background:var(--card); border:1.5px solid var(--line); border-radius:999px; padding:2px 15px; margin-bottom:12px}
  .hsearch .ic{color:var(--muted); flex:0 0 auto; font-size:18px}
  .hsearch input{flex:1; min-width:0; border:none; background:none; outline:none; color:var(--ink); font-size:15px; padding:11px 0; font-family:inherit}
  .hsearch input::placeholder{color:var(--muted)}
  #findResults:not(:empty){background:var(--card); border:1px solid var(--line); border-radius:14px; padding:4px 14px; margin-bottom:14px}
  /* 남부(교재)말 옆에 하노이말 병기 */
  .ntag{display:inline-block; margin-left:6px; font-size:10.5px; font-weight:600; color:var(--muted);
        border:1px solid var(--line); border-radius:5px; padding:0 5px; vertical-align:middle; white-space:nowrap}
  /* 문법 정리 */
  .gchips{margin-bottom:14px}
  .ghead{font-weight:800; font-size:15px; color:var(--brand); margin:4px 0 10px}
  .gcard{border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:9px; background:var(--card)}
  .gcard .gt{font-weight:800; font-size:15px; margin-bottom:3px}
  .gcard .gd{color:var(--muted); font-size:13.5px; line-height:1.55}
  /* 지문 해석 */
  .pgsec{margin-top:14px}
  .pghead{font-weight:800; font-size:14px; color:var(--brand); display:flex; align-items:center; gap:6px; margin-bottom:7px}
  .pgblock{border:1px solid var(--line); border-radius:12px; padding:6px 12px; margin-bottom:10px; background:var(--card)}
  .pgblabel{font-size:11.5px; font-weight:700; color:var(--muted); padding:5px 0 3px}
  .pgline{display:flex; gap:8px; padding:7px 0; border-top:1px solid var(--line)}
  .pgblock .pgblabel + .pgline, .pgblock > .pgline:first-child{border-top:none}
  .pgwho{flex:0 0 auto; min-width:44px; font-size:12px; font-weight:700; color:var(--accent)}
  .pgtxt{flex:1 1 auto; min-width:0}
  .pgvn{font-weight:600; line-height:1.45}
  .pgko{color:var(--muted); font-size:13px; line-height:1.4; margin-top:1px}
  /* 추가자료(EXTRA) : 지문 화면 뼈대를 그대로 쓰고 몇 가지만 더함 */
  .exsrc{margin-left:auto; font-size:11px; font-weight:700; color:var(--muted); background:var(--soft); border-radius:999px; padding:2px 8px}
  .exlead{border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:10px; background:var(--soft); padding:9px 12px; color:var(--muted); font-size:13px; line-height:1.55; margin-bottom:12px}
  .exbody{padding:9px 0; font-size:13.5px; line-height:1.65; color:var(--muted)}
  .exbox{margin:9px 0 3px; padding:9px 11px; border:1px solid var(--line); border-radius:10px; background:var(--soft); font-weight:800; font-size:13.5px; line-height:1.6; text-align:center; letter-spacing:.2px}
  .exnote{border-top:1px dashed var(--line); margin-top:4px; padding:8px 0 9px; color:var(--muted); font-size:12.5px; line-height:1.6}
  .pgvn.exq{font-weight:600; color:var(--muted)}
  .pgvn.exa{font-weight:800}
  .nbp{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; line-height:1.45}
  .nbs{color:var(--muted); font-size:13.5px}
  .nbar{color:var(--muted); font-size:12px}
  .nbn{font-weight:800}
  /* 듣기 연습 (교재 듣기 대본) */
  .lssec{margin-top:16px}
  .lshead{font-weight:800; font-size:13.5px; color:var(--brand); line-height:1.5}
  .lsheadko{color:var(--muted); font-size:12.5px; font-weight:600; margin:2px 0 8px; line-height:1.45}
  .lsblk{border:1px solid var(--line); border-radius:12px; padding:2px 12px 8px; margin-bottom:10px; background:var(--card)}
  .lsbar{display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:9px 0 7px}
  .lsno{flex:0 0 auto; min-width:24px; height:24px; padding:0 7px; border-radius:8px; background:var(--brandsoft); color:var(--brand);
        font-size:12px; font-weight:800; display:inline-flex; align-items:center; justify-content:center}
  .lsbar .lsgap{flex:1 1 auto}
  .lsline{display:flex; gap:8px; align-items:flex-start; padding:7px 2px; border-top:1px solid var(--line)}
  .lsline.now{background:var(--brandsoft); border-radius:8px}
  .lswho{flex:0 0 auto; min-width:32px; font-size:12px; font-weight:700; color:var(--accent); padding-top:2px}
  .lstxt{flex:1 1 auto; min-width:0}
  .lsvn{font-weight:600; line-height:1.45}
  .lsko{color:var(--muted); font-size:13px; line-height:1.4; margin-top:1px}
  .lsblk.hid .lstxt{filter:blur(5px); user-select:none}
  .lshint{font-size:12.5px; color:var(--muted); padding:6px 2px 2px; line-height:1.5}
  /* 단어 연습 */
  .prepcta{display:flex; align-items:center; justify-content:space-between; width:100%;
           background:var(--brand); color:#fff; border:none; margin-bottom:10px; padding:14px 16px}
  .prepcta:hover{background:var(--brand2)}
  .prepcta-l{display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px}
  .prepcta-sub{font-weight:600; font-size:12px; opacity:.85}
  .prepcta-dd{font-weight:800; font-size:17px; background:rgba(255,255,255,.2); padding:3px 10px; border-radius:999px}
  .prepdday{text-align:center; margin:6px 0 4px}
  .prepdday .ddbig{font-size:34px; font-weight:900; color:var(--brand); line-height:1.1}
  .prepdday .ddsub{font-size:12.5px; color:var(--muted); margin-top:2px}
  .prepbar{height:12px; background:var(--brandsoft); border-radius:999px; overflow:hidden}
  .prepbar-fill{height:100%; background:var(--good); border-radius:999px; transition:width .3s}
  .prepstat{display:flex; gap:6px; margin-top:12px}
  .prepstat>div{flex:1; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 4px}
  .prepstat .pnum{display:block; font-size:20px; font-weight:900}
  .prepstat .pnum.good{color:var(--good)} .prepstat .pnum.muted{color:var(--muted)}
  .prepstat .plab{display:block; font-size:11px; color:var(--muted); margin-top:1px}
  .prephead{display:flex; justify-content:space-between; font-weight:700; font-size:13px; margin-bottom:8px}
  .plesson{font-size:12px; color:var(--muted); margin-bottom:8px; display:flex; align-items:center; gap:6px}
  .pdots{display:inline-flex; gap:3px}
  .pdot{width:8px; height:8px; border-radius:50%; background:var(--line)}
  .pdot.on{background:var(--good)}
  .pprompt{font-size:26px; font-weight:800; text-align:center; padding:14px 8px 4px; line-height:1.3}
  .quizbar{height:6px; background:var(--brandsoft); border-radius:999px; overflow:hidden; margin-bottom:12px}
  .quizbar-in{height:100%; background:var(--brand); border-radius:999px; transition:width .3s}
  .prepans{text-align:center; padding:6px 0}
  .pres{display:inline-block; font-weight:800; font-size:14px; padding:3px 12px; border-radius:999px; margin-bottom:8px}
  .pres.good{color:var(--good); background:var(--goodsoft)}
  .pres.warn{color:var(--warn); background:var(--warnsoft)}
  .pres.bad{color:var(--bad); background:var(--badsoft)}
  .pavn{font-size:24px; font-weight:800; margin:2px 0}
  .prepbig{font-size:40px; font-weight:900; color:var(--brand); margin:6px 0}
  /* 개수 배지 */
  .btn.rowbtn{display:flex; align-items:center; gap:9px; text-align:left}
  .badge{margin-left:auto; background:var(--brandsoft); color:var(--brand); font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px}
  .secrow{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
  .listenbox{display:flex; flex-direction:column; align-items:center; gap:10px; padding:14px 0 2px}
  .bigspk{width:104px; height:104px; border-radius:50%; border:none; background:var(--brandsoft); color:var(--brand); font-size:42px; cursor:pointer; transition:.12s}
  .bigspk:active{transform:scale(.96)}
  .listenhint{font-size:13px; color:var(--muted)}

  /* word list */
  .search{width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:14px; font-size:15px; background:var(--card); color:var(--ink); outline:none; margin-bottom:12px}
  textarea.pcustbox{min-height:62px; resize:vertical; font-family:inherit; font-size:14px; line-height:1.55; margin-bottom:0}
  .ta{width:100%; min-height:88px; padding:11px 12px; border:1.5px solid var(--line); border-radius:12px; font-size:12px; font-family:ui-monospace,Menlo,Consolas,monospace; background:var(--bg); color:var(--ink); outline:none; resize:vertical; word-break:break-all}
  .ta:focus{border-color:var(--brand)}
  .tgrid{display:flex; flex-wrap:wrap; gap:8px; margin-top:2px}
  .trow{flex:1 1 150px; display:flex; align-items:center; gap:8px; background:var(--bg); border-radius:10px; padding:9px 12px}
  .tk{font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:800; color:var(--brand); white-space:nowrap}
  .tar{color:var(--muted)}
  .tr{font-weight:600; font-size:14px}
  .wlist{display:flex; flex-direction:column; gap:0}
  .wrow{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:none}
  .wvn{font-weight:700; font-size:16px}
  .wen{color:var(--muted); margin-left:auto; text-align:right; font-size:15px}
  .wen.hide{filter:blur(6px); transition:.15s}
  .wrow:hover .wen.hide{filter:none}
  .lz{font-size:11px;color:var(--brand);background:var(--brandsoft);padding:2px 7px;border-radius:6px;font-weight:700}
  .lz.mine{color:var(--accent);background:var(--accentsoft)}
  .addstatus{font-size:12.5px; font-weight:700; margin:8px 0 0; min-height:17px; display:flex; align-items:center; gap:5px; transition:opacity .25s ease}
  .addstatus.fading{opacity:0}
  .addstatus.ok{color:var(--good)}
  /* 손가락으로 누르기 편하게 44px (30px는 잘 안 눌렸음) */
  .del{border:none;background:var(--badsoft);color:var(--bad);border-radius:10px;width:44px;height:40px;cursor:pointer;font-weight:800;font-size:17px;flex:0 0 auto}
  .del:active{background:var(--bad);color:#fff}
  .star{border:none;background:none;cursor:pointer;font-size:20px;line-height:1;color:var(--muted);padding:2px 4px;flex:0 0 auto}
  .star.on{color:#e2a900}
  .notedot{font-size:11px;letter-spacing:1px;color:var(--brand);flex:0 0 auto}
  label.fld{display:block; font-size:13px; font-weight:700; color:var(--muted); margin:10px 0 6px}
  .foot{text-align:center; color:var(--muted); font-size:12px; padding:18px}
  .emoji{font-size:46px; text-align:center; margin-bottom:6px}

  /* 범위 지정 / select */
  .sel{padding:11px 12px; border:1.5px solid var(--line); border-radius:12px; font-size:15px; background:var(--card); color:var(--ink); font-weight:600; width:100%}
  .row2{display:grid; grid-template-columns:1fr 1.5fr; gap:8px}
  .rsum{margin-top:12px; background:var(--brandsoft); color:var(--brand); border-radius:12px; padding:10px 12px; font-size:13px; font-weight:600}
  .btn.accent{background:var(--accent); color:#fff}
  .keyrow{display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px; font-weight:700; color:var(--ink); margin-top:14px}
  .keyrow input{width:18px; height:18px}

  /* 시험지 (인쇄용) — 항상 흰 종이 느낌 유지 */
  .paper{background:#fff; color:#111; border:1px solid var(--line); border-radius:14px; padding:24px; margin-top:14px}
  .ptitle{font-size:20px; font-weight:800; text-align:center; color:#111}
  .pver{font-size:13px; color:#777; font-weight:700}
  .phead{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:14px 0; font-size:14px; color:#222}
  .pinstr{font-size:12.5px; color:#333; background:#f3f4f6; border-radius:8px; padding:9px 11px; margin-bottom:16px; line-height:1.6}
  /* 직접 출제 표시(연필) + 범례 — 시험지·정답지에 인쇄됨 */
  .pcust{width:.8em; height:.8em; margin-left:2px; vertical-align:baseline; opacity:.85; stroke-width:2.4}
  .plegend{display:flex; align-items:center; gap:4px; font-size:11px; color:#444; margin:-10px 0 14px}
  .paper.onepage .plegend{font-size:9.5px; margin:-4px 0 6px}
  .pgrid{display:grid; grid-template-columns:1fr; gap:9px 28px}
  .pq{display:flex; align-items:baseline; gap:7px; font-size:14.5px; color:#111; break-inside:avoid; padding:2px 0}
  .pqn{color:#777; font-weight:700; min-width:26px}
  .pqp{font-weight:700; white-space:nowrap}
  .pqtag{font-size:10px; color:#999; white-space:nowrap}
  .pqline{flex:1; border-bottom:1px dotted #aaa; min-width:50px; align-self:flex-end; height:15px}
  /* 정답지: 시험지와 같은 밑줄 칸에 정답을 채워 넣음(초록) */
  .pqline.answ{height:auto; align-self:auto; color:#1a7a4f; font-weight:700; padding-left:8px; white-space:normal; line-height:1.35}
  .ppart{margin:20px 0 6px; font-size:15px; font-weight:800; color:#111; border-bottom:2px solid #bbb; padding-bottom:5px}
  .pslist{display:flex; flex-direction:column; gap:15px}
  .psq{break-inside:avoid}
  .psq .pqn{display:inline-block}
  .psp{font-weight:700; font-size:14.5px; color:#111}
  .psline{border-bottom:1px solid #aaa; height:26px; margin-top:7px}
  .psline.answ{height:auto; min-height:22px; color:#1a7a4f; font-weight:700; font-size:13px; padding-bottom:2px; line-height:1.4}
  /* 정답지에만 붙는 출처(몇 과·회화 몇 번) — 시험지 본지엔 없음 */
  .psrc{margin-left:6px; font-size:10.5px; color:#777; font-weight:600; white-space:nowrap}
  .pkeygrid{display:grid; grid-template-columns:1fr 1fr; gap:5px 20px; margin-top:8px}
  /* 2열일 때 세로(열 방향) 채우기: 왼쪽 1~N 내려간 뒤 오른쪽. --prows = ceil(문항수/2) */
  .pkeygrid.colflow{grid-auto-flow:column; grid-template-rows:repeat(var(--prows,20),auto)}
  .pkq{font-size:13px; color:#111; break-inside:avoid}
  .pkq b{color:#777; font-weight:700}
  .pkq i{font-style:normal; color:#1a7a4f; font-weight:700}   /* 정답 강조 */
  .pkey{ margin-top:14px }
  /* 필기용 단어 리스트(인쇄): 베트남어와 뜻이 둘 다 보이는 목록. 보고 공책에 옮겨 적는 용도.
     칸(column-count)으로 흘려서 단어가 많으면 A4 여러 장으로 알아서 넘어감. */
  .plsub{font-size:12px; color:#555; text-align:center; margin:6px 0 14px}
  .plist{column-count:2; column-gap:24px}
  .plist.c1{column-count:1}
  .plist.c3{column-count:3; column-gap:15px}
  .plrow{display:flex; align-items:baseline; gap:6px; font-size:13px; color:#111; padding:3.5px 0;
         border-bottom:1px dotted #ddd; break-inside:avoid; page-break-inside:avoid; -webkit-column-break-inside:avoid}
  .plnum{flex:none; min-width:23px; text-align:right; color:#999; font-weight:700; font-size:10.5px}
  .plvn{font-weight:800}
  .plko{margin-left:auto; text-align:right; color:#444; font-size:11.5px; overflow-wrap:anywhere}
  .plist.c3 .plrow{font-size:11.5px; padding:2.5px 0}
  .plist.c3 .plko{font-size:10.5px}
  .plist.c1 .plrow{font-size:14px; padding:5px 0}
  .pllz{font-size:12.5px; font-weight:800; color:#111; background:#f1f2f4; border-radius:6px;
        padding:4px 8px; margin:10px 0 4px; break-inside:avoid; break-after:avoid}
  @media (min-width:560px){ .pgrid{grid-template-columns:1fr 1fr; grid-auto-flow:column; grid-template-rows:repeat(var(--prows,20),auto)} }
  @page{ margin:0; }   /* 브라우저 자동 머리글·바닥글(날짜·페이지번호·주소) 제거 */
  @media print{
    .topbar,.foot,.noprint{display:none !important}
    body{background:#fff; margin:0; padding:0}
    .wrap{max-width:none; padding:0; zoom:1 !important}   /* 화면 확대는 인쇄에 영향 없게 */
    .paper{border:none; border-radius:0; margin:0; padding:16mm 14mm}  /* 여백은 직접 부여 */
    .pgrid{grid-template-columns:1fr 1fr; grid-auto-flow:column; grid-template-rows:repeat(var(--prows,20),auto)}
    .pq{break-inside:avoid}
    .pkey{ break-before:page; page-break-before:always; margin-top:0 }   /* 정답지는 새 페이지에 */
    .paper.onepage{ padding:7mm 11mm }   /* 한 장에 맞춤: 인쇄 여백도 축소 */
    html.ios .paper.onepage{ zoom:0.9 }   /* 아이폰 사파리: @page margin:0 무시로 여백이 강제돼 2장이 되는 것 방지 — 살짝 축소해 1장 유지(갤럭시·크롬은 무영향) */
    /* 따로 인쇄: 한쪽만 보이게 */
    body.ponly-paper .pkey{ display:none !important; break-before:auto !important; page-break-before:auto !important }   /* 시험지만 인쇄 시: 정답지의 강제 페이지나눔까지 없애 빈 뒷장 방지(아이폰 사파리) */
    body.ponly-key .paper:not(.pkey){ display:none !important }
    body.ponly-key .pkey{ break-before:auto !important; page-break-before:auto !important; margin-top:0 !important }  /* 정답지만 인쇄 시 빈 첫 장 방지 */
  }
  /* A4 한 장에 맞춤 — 글씨·간격 압축 모드 */
  .paper.onepage .ptitle{font-size:15px}
  .paper.onepage .phead{margin:5px 0; font-size:11.5px}
  .paper.onepage .pinstr{font-size:10.5px; padding:5px 8px; margin-bottom:7px}
  .paper.onepage .pgrid{gap:2px 22px}
  .paper.onepage .pq{font-size:11.5px; padding:0}
  .paper.onepage .pqline{height:12px}
  .paper.onepage .ppart{margin:7px 0 2px; font-size:12px; padding-bottom:2px}
  .paper.onepage .pslist{gap:3px}
  .paper.onepage .psp{font-size:11.5px}
  .paper.onepage .psline{height:14px; margin-top:2px}
  .paper.onepage .pkeygrid{gap:3px 16px}
  .paper.onepage .pkq{font-size:11px}
  /* 정답지(밑줄에 정답) 압축: 채워진 줄 높이·줄간격 더 좁힘 */
  .paper.onepage .pqline.answ{line-height:1.15; padding-left:6px}
  .paper.onepage .psline.answ{min-height:0; font-size:11px; padding-bottom:1px; line-height:1.2; margin-top:1px}
  .paper.onepage .psrc{font-size:9px; margin-left:4px}
  /* 인라인 SVG 라인 아이콘 (이모지 대체). 크기는 부모 font-size(1em)에 따름 */
  .ic{width:1em; height:1em; display:inline-block; vertical-align:-.14em; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none}
  .skillcard .ic{stroke-width:1.7}
  /* ===== 3a 홈 리디자인 ===== */
  .seclbl{font-size:11px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin:0 2px 10px}
  .h-hero{display:flex; align-items:center; gap:15px}
  .h-ring{width:88px; height:88px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center}
  .h-ring > div{width:64px; height:64px; border-radius:50%; background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center}
  .h-ring b{font-size:19px; font-weight:900; line-height:1}
  .h-ring b small{font-size:11px; color:var(--muted); font-weight:800}
  .h-ring > div > span{font-size:9.5px; color:var(--muted); margin-top:1px}
  .h-cont{flex:1; min-width:0}
  .h-cont .t{font-size:15px; font-weight:800; margin-bottom:2px}
  .h-cont .d{font-size:12.5px; color:var(--muted); line-height:1.45; margin-bottom:11px}
  .h-resume{display:inline-flex; align-items:center; gap:7px; background:var(--brand); color:#fff; font-weight:800; font-size:13px; padding:9px 15px; border-radius:12px; border:none; cursor:pointer}

  .h-week{display:flex; justify-content:space-between}
  .h-week .dcol{display:flex; flex-direction:column; align-items:center; gap:5px}
  .h-week .dl{font-size:10px; color:var(--muted); font-weight:700}
  .h-week .dcol.tdy .dl{color:var(--brand)}
  .h-week .dd{width:24px; height:24px; border-radius:8px; background:var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff}
  .h-week .dd.on{background:var(--good)}
  .h-week .dd.today{background:var(--brand); box-shadow:0 0 0 3px var(--brandsoft)}
  .softgrid{display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-bottom:20px}
  .softtile{border:1px solid var(--line); background:var(--card); border-radius:18px; padding:15px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:9px; color:var(--ink); transition:.12s}
  .softtile:active{background:var(--bg)}
  .softtile .st-ic{width:42px; height:42px; border-radius:12px; background:var(--brandsoft); color:var(--brand); display:flex; align-items:center; justify-content:center; font-size:21px}
  .softtile .st-nm{font-size:16px; font-weight:800}
  .softtile .st-ds{font-size:12px; color:var(--muted)}
  .h-banner{display:block; width:100%; text-align:left; background:var(--brand); color:#fff; border:none; border-radius:18px; padding:16px 18px; cursor:pointer; margin-bottom:14px}
  .h-banner:active{transform:scale(.995)}
  .h-banner .bt{display:flex; align-items:center; justify-content:space-between}
  .h-banner .bt .l{display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px}
  .h-banner .bt .dd{font-weight:800; font-size:15px; background:rgba(255,255,255,.2); padding:3px 11px; border-radius:999px}
  .h-banner .bbar{height:7px; background:rgba(255,255,255,.25); border-radius:999px; overflow:hidden; margin:13px 0 9px}
  .h-banner .bbar > i{display:block; height:100%; background:#fff; border-radius:999px}
  .h-banner .bsub{display:flex; align-items:center; justify-content:space-between; font-size:12.5px; opacity:.92}
  .lcard{background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:8px 14px; margin-bottom:16px}
  .lrow{display:flex; align-items:center; gap:12px; padding:17px 2px; cursor:pointer; width:100%; background:none; border:none; text-align:left; color:var(--ink); font:inherit}
  .lrow:active{background:var(--bg)}
  .lrow .lr-ic{color:var(--brand); font-size:19px}
  .lrow .lr-nm{font-weight:700; font-size:14.5px}
  .lrow .lr-meta{margin-left:auto; font-size:12px; color:var(--muted)}
  .lrow .lr-meta.badge2{color:var(--brand); background:var(--brandsoft); padding:2px 9px; border-radius:999px; font-weight:700}
  .lrow .lr-chev{color:var(--muted); font-size:16px}
</style>
</head>

const SENT_BY_LESSON = {};
Object.keys(SENT_RAW).forEach(L=>{
  let page = null, ct = false, rd = false;
  SENT_BY_LESSON[L] = SENT_RAW[L].trim().split("\n").map(line=>{
    const pm = line.match(/^#\s*([0-9]+(?:\s*-\s*[0-9]+)?)\s*(ct|rd)?\s*$/);
    if(pm){ page = pm[1].replace(/\s+/g,""); ct = pm[2]==="ct"; rd = pm[2]==="rd"; return null; }   // 쪽(+받아쓰기 ct / 읽기 rd) 마커 줄
    let lr=false; if(line.charAt(0)==="@"){ lr=true; line=line.slice(1); }
    const i=line.indexOf("|"); if(i<0) return null;
    return {vn:line.slice(0,i).trim(), en:line.slice(i+1).trim(), lr, page, ct, rd};
  }).filter(s=>s&&s.vn&&s.en);
});
const sentLessons = () => Object.keys(SENT_BY_LESSON).map(Number).sort((a,b)=>a-b);
const rdSents = l => (SENT_BY_LESSON[l]||[]).filter(s=>s.rd);        // 읽기 지문(ĐỌC HIỂU)
const rdLessons = () => sentLessons().filter(l => rdSents(l).length);
/* 받아쓰기(Chính tả) 지문이 있는 단원 / 그 지문 문장들 */
const ctSents = l => (SENT_BY_LESSON[l]||[]).filter(s=>s.ct);
const ctLessons = () => sentLessons().filter(l => ctSents(l).length);

const allSentences = () => sentLessons().flatMap(l => SENT_BY_LESSON[l] || []);

9: [
`Eun Ji|Anh David đã đi công tác chưa chị?|David 씨는 출장 갔어요?

`Brian|Hôm nay là thứ mấy, vậy chị?|오늘 무슨 요일이에요?

10: [
`Vân|Anh là con thứ mấy trong gia đình?|가족 중에서 몇째예요?
David|Tôi là con thứ hai. Tôi có một chị, một em gái và một em trai.|저는 둘째예요. 누나 한 명, 여동생 한 명, 남동생 한 명이 있어요.

David|23 tuổi, nhỏ hơn tôi 4 tuổi. Còn Vân, gia đình Vân có mấy người? Ba mẹ còn làm việc không?|23살이에요, 저보다 4살 어려요. 그런데 Vân, Vân네 가족은 몇 명이에요? 부모님은 아직 일하세요?

`Vân|Anh đi đâu vậy?|어디 가요?

`Vân|Anh trai anh Brian đang làm việc ở Thành phố Hồ Chí Minh hả, chị?|Brian 씨 형은 호치민시에서 일하고 있어요?

Loan|Anh ấy có khá đông anh em, một anh trai, bốn chị gái.|그는 형제가 꽤 많아요. 형 한 명, 누나 네 명이요.
Vân|Vậy, anh trai anh ấy đã có gia đình chưa?|그럼, 그의 형은 결혼했어요?
Loan|Chưa, anh ấy còn độc thân.|아니요, 그는 아직 미혼이에요.`
],
11: [

`Loan|Khi đến Việt Nam chị mua vé máy bay một chiều hay vé khứ hồi?|베트남에 올 때 편도 항공권을 샀어요, 왕복 항공권을 샀어요?

Loan|Vâng, nhưng hôm nay xe của tôi hư. Tôi đi bằng xe ôm. Chắc là tôi phải đi xe máy lại.|네, 그런데 오늘 제 자전거가 고장 났어요. 그래서 오토바이 택시를 타요. 아무래도 다시 오토바이를 타야 할 것 같아요.
Kate|Tôi thích đi bằng xe ôm. Người lái xe rất thân thiện. Tôi thường nói tiếng Việt với họ.|저는 오토바이 택시 타는 걸 좋아해요. 운전사가 아주 친절해요. 저는 보통 그들과 베트남어로 이야기해요.`,
`Vân|Xe Grab sắp đến chưa anh?|그랩 차가 곧 와요?

12: [

Vân|Từ Thành phố Hồ Chí Minh đến Bến Tre bao xa?|호찌민시에서 벤째까지 얼마나 멀어요?
Loan|Khoảng 90 cây số. Nếu đi bằng xe hơi thì mất hơn hai tiếng.|90킬로미터쯤이에요. 자동차로 가면 두 시간 넘게 걸려요.

`Loan|Lâu quá không gặp. Em đi đâu vậy, Eun Ji?|정말 오랜만이에요. Eun Ji 씨, 어디 갔다 왔어요?

33: [
`Mai|Có phải nhà hàng "Ngon" ở Quận 1 không, anh?|"Ngon" 식당이 1군에 있는 거 맞지요?
Sơn|Ừ, đúng rồi. Chị định đến đó ăn hả?|응, 맞아요. 거기 가서 먹으려고요?
Mai|Vâng. Tôi định mời hai người bạn nước ngoài đi ăn món ăn Việt Nam. Ở đó món gì ngon vậy, anh?|네. 저는 외국인 친구 두 명에게 베트남 음식을 대접하려고 해요. 거기는 무슨 음식이 맛있어요?
Sơn|Nhiều món ngon lắm. Tôi ăn ở đó mấy lần rồi.|맛있는 음식이 아주 많아요. 저는 거기서 몇 번 먹었어요.

Sơn|Nếu muốn có phòng riêng thì chị nên đặt trước.|따로 방을 쓰고 싶으면 미리 예약하는 게 좋아요.`,
`NVPV|Dạ, chào chị. Chị đi mấy người?|안녕하세요. 몇 분이세요?
Mai|Ba người.|세 명이요.
NVPV|Dạ, mời các anh chị vào.|네, 들어오세요.
Mai|Nhà hàng này có món gì ngon, em?|이 식당은 무슨 음식이 맛있어요?
NVPV|Dạ, chả giò, gỏi cá, bánh xèo.|네, 짜조, 고이까, 반쎄오요.
Mai|Ừ. Cho tôi ba món đó trước đi. À, có món gì ăn no không, em?|네. 우선 그 세 가지 주세요. 아, 배부르게 먹을 만한 음식은 있어요?
NVPV|Dạ, có lẩu cua, cơm sen...|네, 게 전골, 연잎밥이 있어요.
Mai|Anh John, anh đã ăn cơm sen bao giờ chưa?|John 씨, 연잎밥을 먹어 본 적 있어요?
John|Rồi. Tôi ăn hai lần rồi. Cơm sen vừa thơm vừa ngon.|있어요. 두 번 먹었어요. 연잎밥은 향도 좋고 맛도 있어요.

John|Chưa. Tôi chưa bao giờ ăn. Nó giống lẩu hải sản, có phải không chị?|아직요. 저는 한 번도 안 먹어 봤어요. 그건 해물 전골이랑 비슷하지요?
Mai|Một chút nữa ăn, anh sẽ biết.|조금 있다 먹어 보면 알 거예요.`,
`Mai|Em ơi, tính tiền!|저기요, 계산해 주세요!
NVPV|Dạ. Chị chờ em một chút!|네. 잠깐만 기다려 주세요!
Mai|Chị Reiko, chị thấy thức ăn ở đây thế nào?|Reiko 씨, 여기 음식이 어때요?
Reiko|Ngon lắm, chị. Tôi thích nhất là cơm sen. Tôi thấy gỏi cá hơi chua, nhưng rất ngon.|아주 맛있어요. 저는 연잎밥이 가장 좋아요. 고이까는 조금 시지만 아주 맛있는 것 같아요.
John|Tôi thì thích nhất món bánh xèo, ăn với rau thơm. Bánh xèo có phải là đặc sản của miền Nam không, chị Mai? Ở Hà Nội tôi chưa bao giờ ăn bánh xèo.|저는 반쎄오가 가장 좋아요, 향채랑 같이 먹으면요. 반쎄오는 남부 특산 음식이 맞지요, Mai 씨? 하노이에서는 반쎄오를 한 번도 못 먹어 봤어요.

34: [

|TOÀN|Vâng, anh ấy là người Úc. Anh James là bạn tôi.|네, 그는 호주 사람이에요. James 씨는 제 친구예요.
|LINDA|Tôi cũng là bạn anh James.|저도 James 씨의 친구예요.`,

3: `#||1. Nghe và chọn câu trả lời đúng.|듣고 알맞은 답을 고르세요.
1|A|Trước đây anh có học tiếng Việt không, Tom?|Tom, 예전에 베트남어를 배웠어요?
|B|Tôi không học tiếng Việt. Tôi học tiếng Thái Lan.|저는 베트남어를 안 배웠어요. 태국어를 배웠어요.
|A|Anh học tiếng Thái ở đâu?|태국어를 어디에서 배웠어요?
|B|Tôi học ở Anh.|저는 영국에서 배웠어요.
|Q|Trước đây Tom học tiếng gì?|예전에 Tom은 무슨 언어를 배웠나요?
2|A|Chào cô. Đây là bạn của em. Bạn em muốn đăng ký học tiếng Việt.|선생님 안녕하세요. 이 사람은 제 친구예요. 제 친구가 베트남어 수업을 등록하고 싶어 해요.
|B|Bạn em muốn đăng ký mấy tháng?|친구는 몇 달 등록하고 싶어 하나요?
|A|Dạ, bạn em muốn học 3 tháng.|네, 제 친구는 3개월 배우고 싶어 해요.
|Q|Bạn em ấy muốn gì?|그 학생의 친구는 무엇을 원하나요?
3|A|Lớp tiếng Việt của chị có mấy sinh viên?|당신의 베트남어 반에는 학생이 몇 명 있어요?
|B|Lớp tôi có 5 sinh viên.|우리 반에는 학생이 5명 있어요.
|A|Họ là người nước nào?|그들은 어느 나라 사람이에요?
|B|Họ đều là người Hàn Quốc.|그들은 모두 한국 사람이에요.
|Q|Sinh viên lớp chị ấy là người nước nào?|그녀의 반 학생들은 어느 나라 사람인가요?
4|A|Anh học tiếng Việt ở trường Đại học Sư Phạm phải không?|사범대학교에서 베트남어를 배우죠?
|B|Không. Tôi học tiếng Việt ở Trường Đại học Khoa học Xã hội và Nhân văn.|아니요. 저는 인문사회과학대학교에서 베트남어를 배워요.
|Q|Anh ấy học tiếng Việt ở đâu?|그는 어디에서 베트남어를 배우나요?
#||2. Nghe một hội thoại, điền từ ngữ còn thiếu vào chỗ trống.|대화를 듣고, 빠진 말을 빈칸에 채우세요.
1|A|Tôi đã học tiếng Anh, tiếng Hàn Quốc và tiếng Nhật.|저는 영어, 한국어 그리고 일본어를 배웠어요.
|B|Chị học tiếng Anh ở Anh, phải không chị Loan?|Loan 씨, 영어는 영국에서 배웠죠?
|A|Không. Tôi học ở Việt Nam. Nhưng giáo viên của tôi là người Mỹ, người Anh và người Úc.|아니요. 저는 베트남에서 배웠어요. 하지만 제 선생님들은 미국 사람, 영국 사람 그리고 호주 사람이었어요.
|B|Chị đã học tiếng Anh mấy năm?|영어를 몇 년 배웠어요?
|A|Năm năm.|5년이요.
|B|Còn tiếng Hàn Quốc và tiếng Nhật, chị học ở đâu?|그러면 한국어와 일본어는 어디에서 배웠어요?
|A|Tôi học tiếng Hàn Quốc ở Seoul, Hàn Quốc. Còn tiếng Nhật tôi học ở Việt Nam. Một bạn người Nhật dạy tôi. Bạn tôi là sinh viên của anh.|저는 한국어를 한국 서울에서 배웠어요. 그리고 일본어는 베트남에서 배웠어요. 일본인 친구 한 명이 저를 가르쳐 줬어요. 제 친구는 당신의 학생이에요.
|B|Sinh viên của tôi? À, chị Keiko phải không?|제 학생이요? 아, Keiko 씨 맞죠?
|A|Vâng.|네.`,

4: `#||1. Nghe hội thoại sau đây, chọn câu trả lời đúng.|다음 대화를 듣고, 알맞은 답을 고르세요.
1|A|Hôm qua tôi đã đến trường Nhân văn đăng ký học tiếng Việt.|어제 저는 인문대학교에 가서 베트남어 수업을 등록했어요.
|B|Anh học mấy ngày một tuần, anh Jinwan?|Jinwan 씨, 일주일에 며칠 배워요?
|A|Năm ngày một tuần. Tôi học buổi chiều, từ 1 giờ đến 5 giờ.|일주일에 5일이요. 저는 오후에 1시부터 5시까지 배워요.
|B|Trước đây, ở Hàn Quốc anh có làm việc không?|예전에 한국에서 일했어요?
|A|Có. Tôi làm nhân viên ở một công ty nhỏ.|네. 저는 작은 회사에서 직원으로 일했어요.
|B|Ở Hàn Quốc, anh làm việc từ mấy giờ đến mấy giờ?|한국에서는 몇 시부터 몇 시까지 일했어요?
|A|Từ 9 giờ sáng đến 5 giờ chiều.|아침 9시부터 오후 5시까지요.
|B|Ở Việt Nam anh có đi làm không?|베트남에서는 일하러 다녀요?
|A|Không. Ở Việt Nam tôi không làm việc.|아니요. 베트남에서 저는 일하지 않아요.
#||2. Nghe đoạn văn sau đây, chọn thông tin đúng.|다음 글을 듣고, 알맞은 정보를 고르세요.
1||Tên anh ấy là Ryan.|그의 이름은 Ryan이에요.
||Ryan là kỹ sư.|Ryan은 엔지니어예요.
||Ở Anh, anh ấy làm việc ở một công ty máy tính.|영국에서 그는 컴퓨터 회사에서 일했어요.
||Anh ấy đã làm ở đó 8 năm.|그는 거기에서 8년 동안 일했어요.
||Hiện nay Ryan đang làm việc ở Việt Nam.|지금 Ryan은 베트남에서 일하고 있어요.
||Anh ấy cũng làm 40 giờ một tuần nhưng không đến công ty.|그도 일주일에 40시간 일하지만 회사에 가지는 않아요.
||Anh ấy làm việc ở nhà.|그는 집에서 일해요.`,

5: `#||1. Nghe các mẫu hội thoại sau đây, chọn câu trả lời đúng.|다음 대화를 듣고, 알맞은 답을 고르세요.
1|A|Ga Sài Gòn ở đâu vậy, anh?|사이공역이 어디에 있어요?
|B|Ở Quận 3.|3군에 있어요.
|A|Cám ơn anh. Ngày mai tôi sẽ đến đó.|고마워요. 내일 저는 거기에 갈 거예요.
|Q|Cô ấy hỏi gì?|그녀는 무엇을 물어봤나요?
2|A|Hôm nay anh không khỏe à?|오늘 몸이 안 좋아요?
|B|Ừ. Hôm nay tôi hơi mệt vì hôm qua tôi uống bia nhiều quá.|응. 어제 맥주를 너무 많이 마셔서 오늘 좀 피곤해요.
|Q|Tại sao hôm nay anh ấy không khỏe?|왜 그는 오늘 몸이 안 좋은가요?
3|A|Bây giờ tôi đi mua sách. Chị đi không?|지금 저는 책을 사러 가요. 같이 갈래요?
|B|Đi mua ở nhà sách à?|서점에 사러 가요?
|A|Không. Ở văn phòng Khoa Việt Nam học.|아니요. 베트남학과 사무실에서요.
|Q|Họ sẽ mua sách ở đâu?|그들은 어디에서 책을 살 건가요?
4|A|Anh có biết địa chỉ của Quán Nem không?|'꽌 냄' 주소를 아세요?
|B|Quán Nem nào, anh?|어느 '꽌 냄'이요?
|A|Quán Nem ở gần Trường Nhân văn.|인문대학교 근처에 있는 '꽌 냄'이요.
|B|À, tôi biết.|아, 알아요.
|Q|Anh ấy hỏi về địa chỉ của nơi nào?|그는 어느 곳의 주소를 물어봤나요?
#||2. Nghe hội thoại sau đây, chọn thông tin đúng.|다음 대화를 듣고, 알맞은 정보를 고르세요.
1|A|Ở Thành phố Hồ Chí Minh, tôi có thể đi tham quan ở đâu, anh?|호찌민시에서 저는 어디를 구경하러 갈 수 있어요?
|B|Bưu điện Thành phố, Nhà thờ Đức Bà, chợ Bến Thành. Nhiều nơi lắm. Chị có thể đi bằng xe buýt hay tắc xi.|시 우체국, 노트르담 성당, 벤탄 시장이요. 아주 많아요. 버스나 택시로 갈 수 있어요.
|A|Tôi thích đi bằng xe buýt. Xe buýt sẽ đi đâu anh?|저는 버스로 가는 걸 좋아해요. 버스는 어디로 가나요?
|B|Xe buýt đi Quận 1, Quận 3.|버스는 1군, 3군으로 가요.
|A|Đi tham quan một tiếng hay hai tiếng vậy, anh?|구경하는 데 한 시간 걸려요, 두 시간 걸려요?
|B|Khoảng 30, 35 phút.|30분에서 35분쯤이요.
|A|Xe buýt có đi buổi chiều không?|버스는 오후에도 다녀요?
|B|Có, có xe buổi sáng và xe buổi chiều.|네, 아침 차도 있고 오후 차도 있어요.`,

6: `#||1. Nghe các câu, các mẫu hội thoại sau đây. Chọn đáp án đúng.|다음 문장과 대화를 듣고, 알맞은 답을 고르세요.
#||Nghe các câu từ 1 đến 5. Chọn đáp án đúng.|1번부터 5번까지 문장을 듣고, 알맞은 답을 고르세요.
1||Tôi tên là Hai.|제 이름은 하이예요.
2||Hôm nay nó không đi học.|오늘 걔는 학교에 안 가요.
3||Anh học tiếng Việt từ mấy giờ?|베트남어를 몇 시부터 배워요?

5||Chị đi đâu vậy?|어디 가세요?
#||Nghe các mẫu hội thoại sau đây. Chọn đáp án đúng.|다음 대화를 듣고, 알맞은 답을 고르세요.
6|A|Hôm qua tôi gặp ông Lê.|어제 저는 Lê 씨를 만났어요.
|B|Thế à? Ông Lê có khỏe không anh?|그래요? Lê 씨는 잘 지내세요?
|A|Dạo này ông ấy không khỏe.|요즘 그분은 건강이 안 좋으세요.
7|A|Tôi đã gặp bạn anh Keener.|저는 Keener 씨의 친구들을 만났어요.
|B|Họ cũng là giáo viên tiếng Anh à?|그들도 영어 선생님이에요?
|A|Không. Họ là sinh viên Trường Đại học Khoa học Xã hội và Nhân văn.|아니요. 그들은 인문사회과학대학교 학생이에요.
8|A|Đây là sách của ông phải không?|이것은 선생님 책 맞죠?
|B|Vâng, sách của tôi.|네, 제 책이에요.
|A|Sách này bao nhiêu tiền?|이 책은 얼마예요?
|B|Hai trăm tám mươi ngàn.|28만 동이요.
9|A|Chào cô.|선생님 안녕하세요.
|B|Chào chị. Hôm nay chị đến sớm quá! Bây giờ là 7 giờ rưỡi. Lớp chúng ta bắt đầu lúc 8 giờ.|안녕하세요. 오늘 정말 일찍 오셨네요! 지금 7시 반이에요. 우리 수업은 8시에 시작해요.
|A|Vâng.|네.
#||2. Nghe đoạn văn sau đây. Chọn câu trả lời đúng.|다음 글을 듣고, 알맞은 답을 고르세요.
1||Xin chào, tôi tên là Thomas.|안녕하세요, 제 이름은 Thomas예요.
||Còn đây là bạn tôi.|그리고 이 사람은 제 친구예요.
||Anh ấy tên là Henry.|그의 이름은 Henry예요.
||Henry đến Thành phố Hồ Chí Minh để du lịch trong ba ngày.|Henry는 3일 동안 여행하려고 호찌민시에 왔어요.
||Tôi và Henry đã đi tham quan Bưu điện Trung tâm Thành phố, Nhà thờ Đức Bà và Bảo tàng Lịch sử.|저와 Henry는 시 중앙우체국, 노트르담 성당 그리고 역사박물관을 구경했어요.
||Ở bưu điện tôi thấy nhiều người Việt Nam và người nước ngoài.|우체국에서 저는 베트남 사람과 외국인을 많이 봤어요.
||Bưu điện ở gần Nhà thờ Đức Bà.|우체국은 노트르담 성당 근처에 있어요.
||Tôi cũng mời Henry đến Trường Đại học Khoa học Xã hội và Nhân văn.|저는 Henry를 인문사회과학대학교에도 초대했어요.
||Tôi đang học tiếng Việt ở đó.|저는 거기에서 베트남어를 배우고 있어요.
||Bạn tôi hỏi: “Học tiếng Việt có khó không?”.|제 친구가 물었어요. “베트남어 배우는 거 어려워?”
||Tôi trả lời là: “Không khó lắm.”|저는 대답했어요. “별로 안 어려워.”`,

7: `#||1. Nghe các mẫu hội thoại, chọn câu trả lời đúng.|다음 대화를 듣고, 알맞은 답을 고르세요.
1|A|Chị có thường ăn sáng ở nhà không?|보통 집에서 아침을 먹어요?
|B|Có, tôi thường ăn sáng ở nhà rồi đi học.|네, 저는 보통 집에서 아침을 먹고 학교에 가요.
|Q|Sau khi ăn sáng chị ấy thường làm gì?|아침을 먹은 뒤에 그녀는 보통 무엇을 하나요?
2|A|Anh thường ăn trưa ở căng tin hay về nhà ăn cơm?|보통 구내식당에서 점심을 먹어요, 아니면 집에 가서 먹어요?
|B|Tôi thường ăn trưa ở một nhà hàng gần trường đại học.|저는 보통 대학교 근처 식당에서 점심을 먹어요.
|Q|Anh ấy thường ăn trưa ở đâu?|그는 보통 어디에서 점심을 먹나요?
3|A|Chiều nay rảnh không? Chúng ta đi xem phim đi!|오늘 오후에 시간 있어요? 우리 영화 보러 가요!
|B|Xin lỗi, chiều nay tôi bận. Tối mai được không?|미안해요, 오늘 오후에는 바빠요. 내일 저녁은 괜찮아요?
|Q|Cô ấy có thể đi xem phim vào ngày nào?|그녀는 어느 날에 영화를 보러 갈 수 있나요?
4|A|Em mệt hả, An?|안, 피곤하니?
|B|Dạ, không. Sáng nay thức dậy sớm quá nên bây giờ em buồn ngủ.|아니요. 오늘 아침에 너무 일찍 일어나서 지금 졸려요.
|Q|Tại sao em An buồn ngủ?|An은 왜 졸린가요?
5|A|Chị uống cà phê không?|커피 드실래요?
|B|Cám ơn anh. Tôi không uống cà phê.|고마워요. 저는 커피를 안 마셔요.
|A|Ồ! Tôi uống nhiều cà phê lắm. Buổi sáng, buổi chiều, buổi tối, tôi đều uống cà phê.|오! 저는 커피를 아주 많이 마셔요. 아침, 오후, 저녁 모두 커피를 마셔요.
|Q|Anh ấy nói gì?|그는 무엇이라고 말했나요?
#||2. Nghe một hội thoại, chọn thông tin đúng.|대화를 듣고, 알맞은 정보를 고르세요.
1|A|Trước đây, buổi sáng bà thức dậy sớm, tập thể dục, ăn sáng, uống cà phê rồi đi làm. Bà thường đến công ty sớm 15 phút.|예전에 할머니는 아침에 일찍 일어나서 운동하고, 아침을 먹고, 커피를 마신 뒤 일하러 갔어요. 할머니는 보통 회사에 15분 일찍 도착했어요.
|B|Bà ăn trưa ở đâu?|할머니는 어디에서 점심을 드셨어요?
|A|Ở căng tin của công ty. Buổi chiều, bà làm việc từ 1 giờ đến 5 giờ.|회사 구내식당에서요. 오후에는 1시부터 5시까지 일하셨어요.
|B|Dạo này bà có đi làm không?|요즘 할머니는 일하러 다니세요?
|A|Không, bà không đi làm.|아니요, 할머니는 일하러 다니지 않으세요.
|B|Vậy, buổi sáng bà làm gì?|그러면 아침에 할머니는 무엇을 하세요?
|A|Bà thức dậy sớm, tập thể dục, ăn sáng, uống cà phê, đọc báo. Buổi trưa bà ăn cơm ở nhà.|할머니는 일찍 일어나서 운동하고, 아침을 먹고, 커피를 마시고, 신문을 읽으세요. 점심에는 집에서 식사하세요.
|B|Còn buổi chiều bà làm gì?|그러면 오후에는 무엇을 하세요?
|A|Cũng đọc báo, cháu ạ.|역시 신문을 읽으신단다.`,

8: `#||1. Nghe các hội thoại sau đây. Chọn câu trả lời đúng.|다음 대화를 듣고, 알맞은 답을 고르세요.
1|A|Chị nói tiếng Tây Ban Nha được không?|스페인어를 할 수 있어요?
|B|Không được. Tôi nói được tiếng Đức và tiếng Ý.|못 해요. 저는 독일어와 이탈리아어를 할 수 있어요.
|Q|Chị ấy nói được tiếng gì?|그녀는 무슨 언어를 할 수 있나요?
2|A|Em học tiếng Nhật bao lâu rồi, Sơn?|Sơn, 일본어를 배운 지 얼마나 됐니?
|B|Dạ, em học tiếng Nhật tám tháng rồi.|네, 저는 일본어를 배운 지 8개월 됐어요.
|Q|Em Sơn học tiếng Nhật bao lâu rồi?|Sơn은 일본어를 배운 지 얼마나 됐나요?
3|A|Chị biết mấy ngoại ngữ?|외국어를 몇 개 아세요?
|B|Tôi biết hai ngoại ngữ, tiếng Nhật và tiếng Việt.|저는 외국어를 두 개 알아요, 일본어와 베트남어요.
|A|Tôi không biết tiếng Nhật. Học tiếng Nhật có khó không chị?|저는 일본어를 몰라요. 일본어 배우는 거 어려워요?
|B|Hơi khó.|조금 어려워요.
|Q|Chị ấy biết ngoại ngữ gì?|그녀는 무슨 외국어를 아나요?
4|A|Tôi thường lên mạng để xem tin tức.|저는 뉴스를 보려고 자주 인터넷에 접속해요.
|B|Anh xem tin tức tiếng Việt hay tiếng Anh?|베트남어 뉴스를 봐요, 영어 뉴스를 봐요?
|A|Tôi xem tin tức tiếng Anh.|저는 영어 뉴스를 봐요.
|B|Tôi cũng thường lên mạng nhưng tôi không xem tin tức.|저도 자주 인터넷을 하지만 뉴스는 안 봐요.
|A|Chị xem gì?|무엇을 보세요?
|B|Xem phim Hàn Quốc.|한국 영화를 봐요.
|Q|Anh ấy lên mạng để làm gì?|그는 무엇을 하려고 인터넷에 접속하나요?
#||2. Nghe một đoạn văn. Điền từ ngữ còn thiếu vào chỗ trống.|글을 듣고, 빠진 말을 빈칸에 채우세요.
1||Đây là Mây, Sơn và Hoàng.|이 사람들은 Mây, Sơn 그리고 Hoàng이에요.
||Mây giỏi ngoại ngữ, thích nghe nhạc tiếng Pháp, đọc báo tiếng Anh và xem phim trên Netflix.|Mây는 외국어를 잘하고, 프랑스어 노래 듣기, 영어 신문 읽기, 넷플릭스로 영화 보기를 좋아해요.
||Sơn cũng giỏi ngoại ngữ.|Sơn도 외국어를 잘해요.
||Sơn đã học ở Hàn Quốc hai năm, học tiếng Anh ở Úc ba năm.|Sơn은 한국에서 2년 공부했고, 호주에서 영어를 3년 배웠어요.
||Hoàng không biết nhiều ngoại ngữ nhưng anh ấy thích xem phim Hàn Quốc và thường nghe nhạc K-pop.|Hoàng은 외국어를 많이 알지는 못하지만 한국 영화 보는 것을 좋아하고 K팝을 자주 들어요.
||Hoàng mới học tiếng Hàn Quốc khoảng 2 tháng.|Hoàng은 한국어를 배운 지 이제 2개월쯤 됐어요.`,

9: `#||1. Nghe các mẫu hội thoại, chọn câu trả lời đúng.|다음 대화를 듣고, 알맞은 답을 고르세요.
1|A|Sắp đến sinh nhật của Emily đấy!|곧 Emily의 생일이야!
|B|Bao giờ?|언제?
|A|Ngày 25, thứ sáu tuần sau.|다음 주 금요일, 25일이야.
|Q|Bao giờ đến sinh nhật của Emily?|Emily의 생일은 언제인가요?
2|A|Hôm nay là thứ hai hả, chị?|오늘 월요일이에요?
|B|Ừ. Hôm nay thứ hai.|응. 오늘 월요일이야.
|A|Anh David và chị Loan đi công tác bao giờ vậy chị?|David 씨와 Loan 씨는 언제 출장 갔어요?
|B|Hai ngày trước.|이틀 전에.
|Q|Anh David và chị Loan đi công tác bao giờ?|David 씨와 Loan 씨는 언제 출장을 갔나요?
3|A|Em đặt tour du lịch chưa?|여행 상품 예약했니?
|B|Dạ, rồi. Em đặt rồi, 5 ngày 4 đêm.|네, 했어요. 4박 5일로 예약했어요.
|Q|Em ấy đã làm gì?|그 아이는 무엇을 했나요?
4|A|Tôi gặp ba mẹ chị Hà rồi. Ba mẹ chị ấy lớn tuổi nhưng khỏe lắm.|저는 하 씨의 부모님을 만났어요. 그분들은 연세가 많으시지만 아주 건강하세요.
|B|Thế à? Ba mẹ chị ấy sinh năm nào?|그래요? 그분들은 몇 년생이세요?
|A|Hai người đều sinh năm 1964.|두 분 모두 1964년생이세요.
|Q|Ba mẹ chị Hà sinh năm bao nhiêu?|하 씨의 부모님은 몇 년에 태어났나요?
#||2. Nghe cuộc hội thoại giữa hai người bạn. Chọn thông tin đúng.|두 친구의 대화를 듣고, 알맞은 정보를 고르세요.
1|A|Tháng 12 năm nay tôi sẽ đi Thái Lan.|올해 12월에 저는 태국에 갈 거예요.
|B|Anh đi du lịch hả?|여행 가는 거예요?
|A|Không. Tôi đi Thái để làm việc.|아니요. 저는 일하러 태국에 가요.
|B|Sao anh không làm ở Việt Nam nữa?|왜 더 이상 베트남에서 일하지 않아요?
|A|Tôi đã làm ở Việt Nam 3 năm rồi. Hiện nay công ty tôi có một văn phòng ở Thái. Tôi sẽ đến đó làm việc.|저는 베트남에서 3년 일했어요. 지금 우리 회사는 태국에 사무실이 하나 있어요. 저는 거기에 가서 일할 거예요.
|B|Ở Thái khi làm việc anh sẽ dùng tiếng Anh hay tiếng Thái?|태국에서 일할 때 영어를 쓸 거예요, 태국어를 쓸 거예요?
|A|Tiếng Anh. Vì nhân viên ở văn phòng đó đều nói được tiếng Anh nên tôi không cần nói tiếng Thái.|영어요. 그 사무실 직원들이 모두 영어를 할 수 있어서 저는 태국어를 할 필요가 없어요.
|B|Anh nói được tiếng Thái à?|태국어를 할 수 있어요?
|A|Được. Trước đây tôi đã học tiếng Thái gần một năm rưỡi.|할 수 있어요. 예전에 저는 태국어를 1년 반 가까이 배웠어요.`,

10: `#||1. Nghe cuộc hội thoại sau đây, chọn câu trả lời đúng.|다음 대화를 듣고, 알맞은 답을 고르세요.
1|A|Người đang nói chuyện với chị Loan là ai vậy, chị?|Loan 씨와 이야기하고 있는 사람은 누구예요?
|B|Em gái của anh Dũng đấy!|Dũng 씨의 여동생이야!
|A|Em anh Dũng bao nhiêu tuổi?|Dũng 씨의 동생은 몇 살이에요?
|B|21 tuổi.|21살이야.
|A|Đang là sinh viên à?|학생이에요?

|A|Cô ấy có gia đình chưa?|그녀는 결혼했어요?

#||2. Nghe một đoạn văn, điền thông tin thích hợp vào chỗ trống.|글을 듣고, 알맞은 정보를 빈칸에 채우세요.
1||Toàn có hai chị gái.|Toàn은 누나가 두 명 있어요.
||Chị cả của anh ấy năm nay 34 tuổi.|그의 큰누나는 올해 34살이에요.
||Chị thứ hai nhỏ hơn chị cả 2 tuổi.|둘째 누나는 큰누나보다 2살 어려요.
||Ba mẹ của họ đã lớn tuổi.|그들의 부모님은 연세가 많으세요.
||Trước đây ba của Toàn là giáo viên tiếng Pháp.|예전에 Toàn의 아버지는 프랑스어 선생님이었어요.
||Mẹ anh ấy làm nội trợ.|그의 어머니는 주부예요.
||Bà ấy thường ở nhà nấu ăn, dọn dẹp, xem tivi, đi ngủ sớm và thức dậy sớm.|어머니는 보통 집에서 요리하고, 청소하고, 텔레비전을 보고, 일찍 자고 일찍 일어나세요.
||Chị cả của Toàn là nhân viên văn phòng.|Toàn의 큰누나는 회사원이에요.

||Chị thứ hai của Toàn lập gia đình khá trẻ.|Toàn의 둘째 누나는 꽤 어린 나이에 결혼했어요.
||Chị ấy cũng là nhân viên văn phòng.|그녀도 회사원이에요.`,
11: `#||1. Nghe các mẫu hội thoại sau đây, chọn câu trả lời đúng.|다음 대화들을 듣고, 알맞은 답을 고르세요.
1|A|Chị đi làm bằng xe gì? Xe máy hay xe buýt?|무엇을 타고 출근해요? 오토바이예요, 버스예요?
|B|Không phải xe máy cũng không phải xe buýt.|오토바이도 아니고 버스도 아니에요.
|A|Thế, chị đi bằng gì?|그럼 뭘 타고 가요?

2|A|Đi bằng xe buýt có bất tiện không, anh?|버스로 다니면 불편해요?
|B|Không. Vì có nhiều xe buýt.|아니요. 버스가 많거든요.
|A|Vậy, anh thường đi bằng xe buýt à?|그럼 보통 버스로 다녀요?
|B|Không. Tôi đi bằng xe máy.|아니요. 저는 오토바이로 다녀요.
|Q|Tại sao anh ấy nói đi bằng xe buýt không bất tiện?|그는 왜 버스로 다니는 것이 불편하지 않다고 했나요?
3|A|Thứ năm tuần trước gia đình tôi đi du lịch ở Phú Quốc.|지난주 목요일에 저희 가족은 푸꾸옥으로 여행 갔어요.
|B|Đi bằng gì, anh?|뭘 타고 갔어요?
|A|Máy bay.|비행기요.
|B|Từ Thành phố Hồ Chí Minh đến Phú Quốc bằng máy bay mất bao lâu?|호치민시에서 푸꾸옥까지 비행기로 얼마나 걸려요?

|B|Buổi sáng vào khoảng 7 giờ, 8 giờ. Còn buổi chiều từ 4 giờ rưỡi đến 5 giờ rưỡi, 6 giờ.|아침에는 7시, 8시쯤이요. 그리고 오후에는 4시 반부터 5시 반, 6시까지요.
|Q|Thành phố Hồ Chí Minh thường đông xe vào lúc nào?|호치민시는 보통 언제 차가 많나요?
5|A|Lần này tôi sẽ không đi Đà Lạt bằng xe khách.|이번에는 시외버스로 달랏에 안 갈 거예요.
|B|Sao vậy?|왜요?

#||2. Nghe cuộc hội thoại sau đây, viết thông tin thích hợp vào chỗ trống.|다음 대화를 듣고, 알맞은 정보를 빈칸에 쓰세요.
1|A|Có internet rất tiện lợi.|인터넷이 있으니까 정말 편리해요.

|B|Anh đặt vé đi đâu?|어디 가는 표를 예약했어요?
|A|Đi Úc. Tôi định đi Úc thăm con trai. Con tôi đang học ở Sydney.|호주요. 아들을 보러 호주에 갈 생각이에요. 제 아이는 시드니에서 공부하고 있어요.
|B|Từ Thành phố Hồ Chí Minh đến Sydney bằng máy bay bao lâu?|호치민시에서 시드니까지 비행기로 얼마나 걸려요?
|A|Khoảng 8 tiếng.|약 8시간이요.`,

12: `#||1. Nghe các câu và các hội thoại sau đây, chọn câu trả lời đúng.|다음 문장과 대화를 듣고, 알맞은 답을 고르세요.

|Q|Anh ấy hỏi gì?|그는 무엇을 물어봤나요?
4|A|Em là con thứ mấy trong gia đình?|가족 중에서 몇째예요?
|B|Em là con một. Ba má em thương em lắm!|저는 외동이에요. 부모님이 저를 아주 예뻐하세요!
|Q|Gia đình em ấy có mấy người?|그 사람의 가족은 몇 명인가요?
5|A|Chị học tiếng Anh mấy ngày một tuần?|일주일에 며칠 영어를 배워요?
|B|Hai ngày, thứ hai và thứ sáu.|이틀이요, 월요일과 금요일이요.
|Q|Chị ấy học tiếng Anh thứ mấy?|그녀는 무슨 요일에 영어를 배우나요?
6|A|Cô cho hỏi, từ đây đến chợ Bến Thành có thể đi bằng xe buýt số mấy?|말씀 좀 여쭐게요, 여기에서 벤탄 시장까지 몇 번 버스로 갈 수 있어요?
|B|Xe số 19.|19번 버스요.
|Q|Bà ấy có thể đi bằng xe buýt số mấy?|그녀는 몇 번 버스로 갈 수 있나요?
7|A|Đi uống bia đi!|맥주 마시러 가자!
|B|Anh muốn đi đâu?|어디로 가고 싶은데요?
|A|Phố đi bộ Bùi Viện. Ở đó bia ngon, món ăn ngon.|부이비엔 보행자 거리요. 거기는 맥주도 맛있고 음식도 맛있어요.
|B|Nhưng ở đó đông người lắm.|그런데 거기는 사람이 아주 많아요.
|Q|Ở Phố đi bộ Bùi Viện có gì?|부이비엔 보행자 거리에는 무엇이 있나요?
8|A|Em gái anh Dũng giỏi tiếng Pháp lắm phải không?|Dũng 씨 여동생은 프랑스어를 아주 잘하죠?
|B|Không phải đâu. Nó mới học tiếng Pháp 2 tháng.|아니에요. 걔는 프랑스어를 배운 지 2개월밖에 안 됐어요.
|Q|Em gái anh Dũng có giỏi tiếng Pháp không?|Dũng 씨 여동생은 프랑스어를 잘하나요?
9|A|Chị biết gì không?|무슨 일인지 아세요?
|B|Biết gì, chị Vân?|뭘요, Vân 씨?
|A|Thu sắp lập gia đình với anh Toàn đấy!|Thu가 Toàn 씨랑 곧 결혼한대요!
|B|Sáng nay tôi nghe chị Loan nói rồi. Thu lập gia đình sớm quá, mới 20 tuổi.|오늘 아침에 Loan 씨한테 들었어요. Thu는 결혼이 너무 이르네요, 이제 20살인데요.
|A|Nhưng anh Toàn 34 tuổi rồi.|그런데 Toàn 씨는 벌써 34살이에요.
|Q|Anh Toàn hơn Thu bao nhiêu tuổi?|Toàn 씨는 Thu보다 몇 살 많나요?
10|A|Bao giờ em học xong sách tiếng Việt này?|이 베트남어 책을 언제 다 배워요?
|B|Cuối tuần sau, chị ạ.|다음 주말이요.
|A|Học xong, em định làm gì?|다 배우면 뭘 할 생각이에요?
|B|Có lẽ em về nước một tháng.|아마 한 달 정도 고향에 다녀올 것 같아요.
|Q|Sau khi học xong sách tiếng Việt, em ấy sẽ làm gì?|베트남어 책을 다 배운 뒤에 그 사람은 무엇을 할 건가요?
#||2. Dựa vào bài nghe, chọn câu trả lời đúng.|들은 내용을 바탕으로 알맞은 답을 고르세요.
1||Tôi không tập thể dục vào buổi sáng.|저는 아침에 운동을 하지 않아요.
||Lúc 6 giờ chiều tôi đi bằng xe đạp đến công viên để tập thể dục.|오후 6시에 저는 운동하러 자전거를 타고 공원에 가요.
||Hôm nay trong công viên tôi gặp một người nước ngoài.|오늘 공원에서 저는 외국인 한 명을 만났어요.
||Anh ấy đi bộ rất nhanh.|그는 아주 빠르게 걸었어요.
||Anh ấy chào tôi bằng tiếng Việt.|그는 베트남어로 저에게 인사했어요.
||Tôi hỏi anh ấy đến công viên bằng phương tiện gì.|저는 그에게 무엇을 타고 공원에 왔는지 물어봤어요.
||Anh ấy nói anh ấy đi bộ.|그는 걸어서 왔다고 말했어요.`,

/* ── 아래부터 교재2 부록 "NỘI DUNG PHẦN NGHE" 149~159쪽 (교재2 1~12과 = 앱 33~44과) ── */
33: `#||Bài nghe 1. Nghe ba đoạn hội thoại sau đây, chọn ý đúng:|듣기 1. 다음 세 대화를 듣고, 알맞은 내용을 고르세요.
1|Nam|Chị đã ăn phở ở quán “Dậu” bao giờ chưa?|“저우” 가게에서 쌀국수를 먹어 본 적 있어요?
|Nữ|Rồi, tôi ăn một lần rồi.|네, 한 번 먹어 봤어요.
|Nam|Chị thấy thế nào?|어땠어요?
|Nữ|Tôi thấy ngon, nhưng... hơi mắc.|맛있었어요, 그런데... 좀 비쌌어요.
|Nam|Vậy à? Tôi chưa bao giờ ăn ở đó.|그래요? 저는 거기서 한 번도 먹어 본 적이 없어요.
2|Nam|Chào các bạn. Tôi xin phép về trước.|여러분 안녕히 계세요. 저는 먼저 가 볼게요.
|Nữ|Mới bốn giờ rưỡi, chúng ta đang vui. Anh về sớm làm gì?|이제 4시 반이고, 우리 재미있게 놀고 있잖아요. 왜 이렇게 일찍 가요?
|Nam|Tôi phải về chuẩn bị bữa tối cho gia đình.|집에 가서 가족을 위해 저녁을 준비해야 해요.
|Nữ|Còn vợ anh đâu?|그럼 부인은요?
|Nam|Chiều nay vợ tôi đi chơi với bạn, tôi phải nấu ăn.|오늘 오후에 아내가 친구랑 놀러 가서, 제가 요리해야 해요.
|Nữ|Vậy à?|그래요?
3|Nữ|Ngày mai là sinh nhật của chị Thu. Chúng ta mời chị Thu đi nhà hàng. Anh đồng ý không?|내일이 Thu 씨 생일이에요. 우리 Thu 씨를 식당에 초대해요. 동의해요?
|Nam|Sinh nhật chị Thu à? Đồng ý! Đi nhà hàng nào?|Thu 씨 생일이요? 좋아요! 어느 식당에 갈까요?
|Nữ|Đi nhà hàng Thái Lan có được không? Tôi thấy món ăn Thái rất ngon.|태국 식당에 가도 될까요? 태국 음식이 아주 맛있는 것 같아요.
|Nam|Món Thái ngon, nhưng tôi thấy hơi cay. Chị Thu có thích không?|태국 음식은 맛있는데, 좀 매운 것 같아요. Thu 씨가 좋아할까요?
|Nữ|Vậy chúng ta đi quán “Hương Xưa” đi, ăn món Việt Nam. Quán đó vừa ngon vừa rẻ...|그럼 “흐엉 쓰아” 가게에 가요, 베트남 음식을 먹어요. 그 가게는 맛있고 싸기도 해요...
|Nam|À, tuyệt! Tôi biết quán đó. Tôi sẽ gọi điện đặt bàn trước.|아, 좋아요! 저 그 가게 알아요. 제가 미리 전화해서 자리를 예약할게요.
#||Bài nghe 2. Nghe và trả lời câu hỏi:|듣기 2. 듣고 질문에 답하세요.
|Nữ|Cuối tuần anh thường làm gì?|주말에 보통 뭐 해요?
|Nam|Đi gặp bạn bè hoặc nấu ăn cho cả nhà.|친구를 만나러 가거나 온 가족을 위해 요리를 해요.
|Nữ|Anh nấu ăn được hả? Anh thường nấu món gì?|요리할 줄 알아요? 보통 무슨 음식을 만들어요?
|Nam|Tôi chỉ làm những món bình thường. Chẳng hạn như bò bít tết, bánh xèo, gỏi cá, lẩu hải sản.|평범한 음식만 만들어요. 예를 들면 소고기 스테이크, 반쎄오, 생선회무침, 해물 전골이요.
|Nữ|Ồ! Anh làm được bánh xèo à? Giỏi quá! Tôi chỉ biết làm trứng ốp la thôi. Tôi không biết làm bánh xèo.|오! 반쎄오를 만들 줄 알아요? 대단해요! 저는 계란 프라이만 할 줄 알아요. 반쎄오는 만들 줄 몰라요.
|Nam|À, tôi lên mạng, vừa xem vừa làm.|아, 저는 인터넷에 들어가서 보면서 만들어요.
|Nữ|Anh đã nấu phở bao giờ chưa?|쌀국수를 끓여 본 적 있어요?
|Nam|Rồi, tôi nấu phở nhiều lần rồi, nhưng không ngon.|네, 여러 번 끓여 봤는데, 맛이 없었어요.
|Nữ|Phở khó nấu lắm! Nếu muốn ăn phở, ra tiệm là ngon nhất.|쌀국수는 끓이기 아주 어려워요! 쌀국수가 먹고 싶으면 가게에 가는 게 제일 맛있어요.`,

34: `#||Bài nghe 1. Nghe 3 mẫu đối thoại và trả lời câu hỏi:|듣기 1. 세 개의 대화를 듣고 질문에 답하세요.
1|Nam|Từ khách sạn này ra bãi biển có xa không, cô?|이 호텔에서 해변까지 멀어요?
|Nữ|Tôi không biết có xa không, nhưng đi bộ chỉ mất khoảng 7, 8 phút thôi.|먼지는 모르겠지만, 걸어서 7, 8분밖에 안 걸려요.
2|Nữ|Anh đã đi Vũng Tàu, Mũi Né, Nha Trang, Phú Quốc rồi, phải không? Anh thích đâu nhất?|붕따우, 무이네, 나짱, 푸꾸옥에 가 봤죠? 어디가 제일 좋아요?
|Nam|Tôi thích Mũi Né nhất.|저는 무이네가 제일 좋아요.
|Nữ|Anh thích gì ở đó?|거기서 뭐가 좋아요?
|Nam|Tôi thích hải sản. Buổi tối tôi và bạn bè vừa uống bia vừa ăn hải sản. Thú vị lắm!|저는 해산물이 좋아요. 저녁에 저와 친구들은 맥주를 마시면서 해산물을 먹어요. 아주 재미있어요!
|Nữ|Tôi thì tôi thích đồi cát ở Mũi Né!|저는요, 저는 무이네의 모래언덕이 좋아요!
3|Nữ|Khách sạn anh ở có tốt không?|묵고 있는 호텔은 좋아요?
|Nam|Hơi bất tiện.|좀 불편해요.
|Nữ|Bất tiện thế nào?|어떻게 불편해요?
|Nam|Nó chỉ có một cái thang máy. Lên, xuống phải chờ hơi lâu.|엘리베이터가 하나뿐이에요. 오르내릴 때 좀 오래 기다려야 해요.
#||Bài nghe 2. Nghe đoạn hội thoại và trả lời câu hỏi:|듣기 2. 대화를 듣고 질문에 답하세요.
|Nữ|Thứ sáu tuần trước sao anh và anh Colin không đi học?|지난주 금요일에 왜 Colin 씨랑 학교에 안 왔어요?
|Nam|Tôi và anh Colin đi Vũng Tàu.|저와 Colin 씨는 붕따우에 갔어요.
|Nữ|Đi bằng xe khách à?|시외버스로 갔어요?
|Nam|Không. Chúng tôi đi bằng xe máy. Anh Colin chở tôi.|아니요. 저희는 오토바이로 갔어요. Colin 씨가 저를 태워 줬어요.
|Nữ|Từ đây ra Vũng Tàu mất mấy tiếng?|여기서 붕따우까지 몇 시간 걸려요?
|Nam|Vừa đi vừa nghỉ mất hơn 4 tiếng. Chúng tôi ra đến Vũng Tàu trước 11 giờ. Khách sạn cho nhận phòng sau 2 giờ nên chúng tôi đi tắm biển trước.|가다 쉬다 하면서 4시간 넘게 걸렸어요. 저희는 11시 전에 붕따우에 도착했어요. 호텔이 2시 이후에 체크인을 해 줘서 저희는 먼저 해수욕을 하러 갔어요.
|Nữ|Cuối tuần, khách sạn mắc lắm, phải không?|주말에는 호텔이 아주 비싸죠?
|Nam|Vâng, hơi mắc, trên 600 ngàn một đêm.|네, 좀 비싸요, 하룻밤에 60만 동이 넘어요.`,

35: `#||Bài nghe 1. Nghe các đoạn hội thoại sau đây, chọn câu trả lời đúng:|듣기 1. 다음 대화들을 듣고, 알맞은 답을 고르세요.
1|Nam|Tôi muốn mua một, hai kí cà phê mang về nước. Mua ở các quán cà phê có rẻ không, chị?|커피를 1, 2킬로 사서 고국에 가져가고 싶어요. 카페에서 사면 싼가요?
|Nữ|Mua ở các quán cà phê không rẻ đâu. Anh nên mua ở siêu thị hay ở chợ Bến Thành. Nhưng tôi nghĩ mua trên mạng rẻ nhất.|카페에서 사면 싸지 않아요. 마트나 벤탄 시장에서 사는 게 좋아요. 그런데 인터넷으로 사는 게 제일 싼 것 같아요.
2|Nữ|Tôi sẽ chở anh đi mua giày.|제가 신발 사러 태워다 줄게요.
|Nam|Ở đâu?|어디서요?
|Nữ|Ở một cửa hàng ở Quận 1. Cửa hàng này rất nổi tiếng.|1군에 있는 어느 가게요. 이 가게는 아주 유명해요.
|Nam|Giày ở đó thế nào?|거기 신발은 어때요?
|Nữ|Chắc chắn là tốt. Anh đừng lo.|틀림없이 좋아요. 걱정하지 마세요.
3|Nam|Em có áo dài Việt Nam không, Mariko?|Mariko 씨, 베트남 아오자이 있어요?
|Nữ|Có. Em có hai cái. Một cái em mua. Một cái bạn em mới tặng hôm qua.|있어요. 두 벌 있어요. 한 벌은 제가 샀어요. 한 벌은 어제 친구가 선물해 줬어요.
|Nam|Em mua hồi nào?|언제 샀어요?
|Nữ|Em mua tuần trước, ở chợ Bến Thành.|지난주에 벤탄 시장에서 샀어요.
|Nam|Đẹp không?|예뻐요?
|Nữ|Đẹp, nhưng mà cái của bạn em tặng đẹp hơn.|예뻐요, 그런데 친구가 선물해 준 게 더 예뻐요.
4|Nam|Cho hai ly cà phê sữa đá, ít sữa nhé! À... mà thôi! Hai ly cà phê đá thôi.|아이스 연유커피 두 잔 주세요, 연유는 적게요! 아... 아니에요! 아이스 블랙커피 두 잔만요.
|Nữ|Bốn ly phải không, anh?|네 잔 맞죠?
|Nam|Không. Chị đừng làm cà phê sữa đá. Chỉ hai ly cà phê đá thôi.|아니요. 아이스 연유커피는 만들지 마세요. 아이스 블랙커피 두 잔만요.
5|Nữ|Anh xem gì vậy?|뭘 보고 있어요?
|Nam|Tôi xem các chương trình khuyến mãi trong tháng 7.|7월 할인 행사들을 보고 있어요.
|Nữ|Tháng 7 là thời gian học sinh nghỉ hè. Có chương trình khuyến mãi du lịch phải không anh?|7월은 학생들이 여름방학 하는 때죠. 여행 할인 행사가 있죠?
|Nam|Phải. Nhưng tôi chỉ tìm máy lạnh giảm giá thôi. Sắp đến mùa hè rồi!|맞아요. 그런데 저는 할인하는 에어컨만 찾고 있어요. 곧 여름이 오잖아요!
#||Bài nghe 2. Nghe và trả lời những câu hỏi sau đây:|듣기 2. 듣고 다음 질문들에 답하세요.
|Nam|Bây giờ việc mua sắm rất tiện lợi. Không cần đi siêu thị, đi chợ cũng có thể mua sắm được.|요즘은 쇼핑이 아주 편리해요. 마트나 시장에 가지 않아도 살 수 있어요.
|Nữ|Chỉ ở nhà nhưng vẫn mua sắm được à? Tôi không hiểu.|집에만 있어도 살 수 있다고요? 이해가 안 돼요.
|Nam|Chị chỉ cần vào internet, xem sản phẩm, xem giá rồi đặt hàng.|인터넷에 들어가서 상품을 보고, 가격을 본 다음 주문하기만 하면 돼요.
|Nữ|À, hiểu rồi. Nhưng tôi không thích mua như vậy, vì không biết chất lượng thế nào. Tôi chỉ thích mua ở cửa hàng thôi.|아, 알겠어요. 그런데 저는 그렇게 사는 걸 안 좋아해요, 품질이 어떤지 모르니까요. 저는 가게에서 사는 것만 좋아해요.
|Nam|Mất nhiều thời gian lắm.|시간이 아주 많이 걸려요.
|Nữ|Mất thời gian nhưng không lo lắng về chất lượng.|시간은 걸리지만 품질을 걱정하지 않아요.`,

  const secs = [];

  String(LISTEN_RAW[L]).trim().split("\n").forEach(row=>{

    grp.lines.push({ who, vn, ko });
  });
  LISTEN[Number(L)] = secs;
});

let WORDS = [];
function buildWords(){
  WORDS = []; let id = 0;
  Object.keys(RAW).forEach(L=>{
    RAW[L].trim().split("\n").forEach(line=>{
      line = line.trim(); if(!line) return;
      const i = line.indexOf("|"); if(i<0) return;
      const vn = line.slice(0,i).trim(), en = line.slice(i+1).trim();
      if(vn && en) WORDS.push({id:id++, lesson:Number(L), vn, en, eng: ENG_MAP[L+"||"+norm(vn)] || ""});
    });
  });
  lsGet("_custom", []).forEach(c=>{
    // eng(영어 뜻)은 선택 — 있으면 검색·시험지 en2vn에서 교재 단어와 똑같이 쓰임
    if(c.vn && c.en) WORDS.push({id:id++, lesson:"custom", vn:c.vn, en:c.en, eng: c.eng || ""});
  });
  // 단원 내 번호(num)와 전체 순서(gi) 부여 — 범위 지정에 사용
  const cnt = {};
  WORDS.forEach((w,i)=>{ w.gi = i; cnt[w.lesson] = (cnt[w.lesson]||0)+1; w.num = cnt[w.lesson]; });
}
function lessonsList(){
  const nums=[...new Set(WORDS.filter(w=>typeof w.lesson==="number").map(w=>w.lesson))].sort((a,b)=>a-b);
  if(WORDS.some(w=>w.lesson==="custom")) nums.push("custom");
  return nums;
}
/* 범위 고르기 화면에 단원을 늘어놓는 순서 : 지금 배우는 교재2권(33~44)을 맨 앞,
   그다음 교재1권(1~12), 그다음 나머지(오늘 배운 ★·7/2 복습·Expats·주제별), 내 단어는 맨 끝.
   ⚠️ 보여 주는 순서만 바꾸는 것. 데이터 순서(lessonsList·sentLessons·WORDS 차례)는 그대로 둠.
   그래서 '번호로 범위 지정'(시작~끝 단어)은 원래 차례를 그대로 씀. 거긴 순서가 곧 범위라서.
   2026-08-04 사용자 요청("교재2 -> 교재1 -> 다른것들"). 단어 리스트 '빠른 선택'은 원래부터 이 차례였음. */
function pickRank(l){
  if(typeof l!=="number") return 3;      // "custom"(내 단어) 등
  if(l>=33 && l<=44) return 0;           // 교재2권
  if(l>=1  && l<=12) return 1;           // 교재1권
  return 2;                              // 개인 세트(13·14) · Expats(15~26) · 주제별(27~32)
}
function byPickOrder(ls){
  return (ls||[]).slice().sort((a,b)=>{
    const d = pickRank(a)-pickRank(b); if(d) return d;
    if(typeof a==="number" && typeof b==="number") return a-b;
    return String(a).localeCompare(String(b));
  });
}
const LESSON_NAMES = {

     (예전엔 이름이 없어 "Lesson 1"로 새어 나왔고, 옆의 "교재2 · 1과"와 짝이 안 맞아 헷갈렸음) */
  1: "교재1 · 1과", 2: "교재1 · 2과", 3: "교재1 · 3과", 4: "교재1 · 4과", 5: "교재1 · 5과", 6: "교재1 · 6과",

  27: "필수 동사", 28: "필수 형용사", 29: "음식·요리", 30: "집·물건·옷", 31: "사람·몸·동물", 32: "자연·장소·생활",
  /* 33~44 = 교재 2권 부록 단어표 BÀI 1~12 (1권 1~12과와 번호가 겹치지 않게 "교재2"를 앞에 붙임) */
  33: "교재2 · 1과", 34: "교재2 · 2과", 35: "교재2 · 3과", 36: "교재2 · 4과", 37: "교재2 · 5과", 38: "교재2 · 6과",
  39: "교재2 · 7과", 40: "교재2 · 8과", 41: "교재2 · 9과", 42: "교재2 · 10과", 43: "교재2 · 11과", 44: "교재2 · 12과" };
const lessonLabel = l => l==="custom" ? "내 단어" : (typeof l==="number" ? (LESSON_NAMES[l] || ("Lesson "+l)) : l);
/* 한국어 '과' 표기용: 이름이 있으면 이름(오늘 배운 ★ · 2권 1과 …), 없으면 "N과".
   → 13·14(개인)·15~26(2권)이 맨숫자 "15과"로 새지 않게(교재 연장선 오해 방지). */
const lessonName = l => l==="custom" ? "내 단어" : (LESSON_NAMES[l] ? LESSON_NAMES[l] : (l+"과"));
/* 시험지 정답지처럼 자리가 좁은 곳에 쓰는 짧은 꼬리표: "교재1 · 2과" → "교재1 2과" (가운뎃점만 뺌) */
const lessonSrcTag = l => lessonName(l).replace(" · ", " ");
/* 고른 단원이 많으면 제목이 한없이 길어지므로 이어지는 과를 묶어서 표기.
   [1,2,3,33,34] → "교재1 1~3과, 교재2 1~2과" */
function compactLessons(ls){
  const part = l => { const m = (LESSON_NAMES[l]||"").match(/^(.+) · (\d+)과$/); return m ? {book:m[1], n:Number(m[2])} : null; };
  const out = []; let i = 0;
  while(i < ls.length){
    const p = part(ls[i]);
    if(!p){ out.push(lessonName(ls[i])); i++; continue; }
    let j = i, last = p.n, q;
    while(j+1 < ls.length && (q = part(ls[j+1])) && q.book===p.book && q.n===last+1){ j++; last = q.n; }
    out.push(j>i ? `${p.book} ${p.n}~${last}과` : `${p.book} ${p.n}과`);
    i = j+1;
  }
  return out.join(", ");
}

/* 남부(호치민)말 → 북부(하노이)말 병기.
   교재가 호치민에서 만든 것이라 남부말만 실린 단어가 있음. 표준어(하노이)도 같이 알아두라고 보여줌.
   ⚠️ 교재 뜻(en)·문장은 손대지 않음 — 화면 표시(단어장·검색)와 쓰기 정답 인정에만 씀. */
const NORTH = { "trễ":"muộn", "mắc":"đắt" };
const northOf = vn => NORTH[String(vn||"").trim().toLowerCase()] || "";
const northTag = vn => { const n=northOf(vn); return n ? `<span class="ntag" title="하노이(북부)에서 더 흔한 말">하노이 ${n}</span>` : ""; };
const NORTH_N = {}; Object.keys(NORTH).forEach(k=>{ NORTH_N[normTone(NORTH[k])] = k; });   /* muộn → trễ (검색용) */

/* =========================================================
   4) 도우미 함수
   ========================================================= */
function stripDia(s){
  return s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D");
}
function norm(s){
  return stripDia(String(s).toLowerCase())
    .replace(/[().,/;:!?'"’]/g," ")
    .replace(/\s+/g," ").trim();
}
function acceptable(answer){
  const set = new Set();
  const add = v => { const n=norm(v); if(n) set.add(n); };
  const stripLead = v => v.replace(/^(to|a|an|the)\s+/i,"");
  answer.split(/[,;/]/).map(x=>x.trim()).filter(Boolean).concat(answer).forEach(v=>{
    add(v); add(stripLead(v));
    const noParen = v.replace(/\([^)]*\)/g," ").trim();   // 괄호 내용 제거 버전
    add(noParen); add(stripLead(noParen));
    (v.match(/\d+/g)||[]).forEach(n=>add(n));             // 답에 든 숫자만 입력해도 정답 (예: "숫자 15"→"15")
  });
  return set;
}
function isCorrectTyped(answer, input){
  const ni = norm(input); if(!ni) return false;
  const set = acceptable(answer);
  if(set.has(ni)) return true;
  return set.has(ni.replace(/^(to|a|an|the)\s+/,""));
}
/* 베트남어 답은 성조(đ/d 포함)까지 채점 — "ok"=완전정답 / "tone"=철자는 맞고 성조만 틀림 / "no"=오답 */
/* 성조 부호 위치 통일: khoẻ=khỏe, hoà=hòa, thuý=thúy 처럼 부호를 어느 모음에 찍든 같은 단어로 봄. 성조 자체는 유지. */
const TONEPOS = {
  "oà":"òa","oá":"óa","oả":"ỏa","oã":"õa","oạ":"ọa",
  "oè":"òe","oé":"óe","oẻ":"ỏe","oẽ":"õe","oẹ":"ọe",
  "uỳ":"ùy","uý":"úy","uỷ":"ủy","uỹ":"ũy","uỵ":"ụy"
};
function canonTone(s){ return String(s).normalize("NFC").replace(/o[àáảãạèéẻẽẹ]|u[ỳýỷỹỵ]/g, m => TONEPOS[m] || m); }
function normTone(s){ return canonTone(String(s).toLowerCase()).replace(/[().,/;:!?'"’]/g," ").replace(/\s+/g," ").trim(); }
function acceptableTone(answer){
  const set=new Set();
  const add=v=>{ const n=normTone(v); if(n) set.add(n); };
  answer.split(/[,;/]/).map(x=>x.trim()).filter(Boolean).concat(answer).forEach(v=>{ add(v); add(v.replace(/\([^)]*\)/g," ").trim()); });
  return set;
}
/* 대문자(고유명사) 검사 — 나라·지명·언어 이름 등은 대문자로 써야 함.
   Anh(영국)↔anh(형/오빠), Mỹ·Việt·Hàn Quốc … 처럼 대문자 자리에 소문자를 쓰면 오답.
   규칙: 정답이 대문자인 자리에 입력이 소문자면 실패. 입력에 대문자가 '더' 있는 건 봐줌(문장 첫 글자 습관). */
function normCase(s){ return canonTone(String(s)).replace(/[().,/;:!?'"’]/g," ").replace(/\s+/g," ").trim(); }
function capForms(answer){
  const arr=[];
  String(answer).split(/[,;/]/).map(x=>x.trim()).filter(Boolean).forEach(v=>{ arr.push(v); const p=v.replace(/\([^)]*\)/g," ").trim(); if(p) arr.push(p); });
  return arr;
}
function needsCap(answer){ return capForms(answer).some(f => f !== f.toLowerCase()); }
function capOk(answer, input){
  const I = normCase(input), Il = normTone(input);
  for(const form of capForms(answer)){
    if(normTone(form) !== Il) continue;      // 이 형태와 철자·성조가 일치할 때만 대문자 비교
    const A = normCase(form);
    if(A.length !== I.length) return true;    // 글자 수가 안 맞으면(정렬 불가) 관대하게 통과
    let ok=true;
    for(let i=0;i<A.length;i++){
      if(A[i] !== A[i].toLowerCase() && I[i] === I[i].toLowerCase()){ ok=false; break; }  // 정답=대문자, 입력=소문자
    }
    if(ok) return true;                        // 대문자까지 맞는 형태가 하나라도 있으면 정답
  }
  return false;
}
/* 채점이 '오답'일 때, 철자·성조는 맞고 대문자만 틀린 경우면 올바른 표기를 돌려줌(안내용). 아니면 "". */
function vnCaseHint(answer, input){
  if(!input || !normTone(input) || !needsCap(answer)) return "";
  const Il = normTone(input);
  for(const form of capForms(answer)){
    if(normTone(form)===Il){ return capOk(answer, input) ? "" : form; }  // 철자 맞음 → 대문자 틀렸으면 안내
  }
  return "";
}
function checkVnTyped(answer, input, strictCase){
  if(!normTone(input)) return "no";
  if(acceptableTone(answer).has(normTone(input))){
    if(strictCase && !capOk(answer, input)) return "no";   // 대문자 틀림 = 오답(고유명사)
    return "ok";                                            // 성조까지 정확
  }
  if(isCorrectTyped(answer, input)) return "tone";          // 성조 빼면 맞음 → 성조만 틀림
  return "no";
}
/* 뜻 조각(콤마/슬래시로 구분)을 각각 정규화해서 반환 */
function meaningTokens(s){ return String(s).split(/[,;/]/).map(t=>norm(t)).filter(Boolean); }
function meaningsOverlap(a, b){ const A=new Set(meaningTokens(a)); return meaningTokens(b).some(t=>A.has(t)); }
/* 같은/겹치는 한국어 뜻을 가진 다른 베트남어도 정답 인정
   (예: 뜻 "매우, 아주" → rất·lắm 모두 정답 / 뜻 "얼마, 몇" 인데 mấy(몇) 입력 → "몇" 겹침 → 정답) */
function checkVnAny(promptKo, expectedVn, input){
  const target = norm(promptKo);
  const cands = new Set([expectedVn]);
  if(northOf(expectedVn)) cands.add(northOf(expectedVn));   // 교재는 남부말(trễ)이지만 하노이말(muộn)로 써도 정답
  WORDS.forEach(x=>{ if(norm(x.en)===target){ cands.add(x.vn); if(northOf(x.vn)) cands.add(northOf(x.vn)); } });
  let best = "no";
  for(const vn of cands){
    const r = checkVnTyped(vn, input, true);   // 단어 시험은 대문자까지 채점
    if(r==="ok") return "ok";
    if(r==="tone") best = "tone";
  }
  // 뜻이 겹치는(부분 일치) 실제 교재 단어면 그 베트남어도 정답 인정
  for(const x of WORDS){
    if(cands.has(x.vn)) continue;
    if(!meaningsOverlap(x.en, promptKo)) continue;
    const r = checkVnTyped(x.vn, input, true);
    if(r==="ok") return "ok";
    if(r==="tone") best = "tone";
  }
  return best;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let VOICES = [];
/* ⚠️ 목소리 목록은 브라우저가 '조금 뒤에' 채워줌 — 앱이 막 켜진 순간엔 거의 항상 빈 배열임.
   그래서 '아직 안 온 것'과 '정말 하나도 없는 것'을 구분할 표시가 필요함.
   VOICES_READY 가 true 인데도 목록이 비어 있으면 → 이 화면에선 발음이 아예 안 남. */
let VOICES_READY = false;
function loadVoices(){
  try{ VOICES = (window.speechSynthesis && speechSynthesis.getVoices()) || []; }catch(e){ VOICES = []; }
  if(VOICES.length) VOICES_READY = true;
}
/* ⚠️ 카톡·인스타 등 '앱 안에서 열리는 브라우저'(인앱 브라우저)는 소리 읽기(Web Speech)를 지원하지 않음.
   특히 안드로이드 카톡은 Chrome WebView라 음성 목록이 아예 비어 있어 **아무 소리도 안 남**.
   → 감지해서 '크롬/사파리로 열기' 버튼을 보여줌. (사용자 제보: 카톡 링크로 바로 열면 소리 안 남) */
const IN_APP = /KAKAOTALK|Instagram|FBAN|FBAV|FB_IAB|NAVER\(inapp|Line\/|DaumApps|everytimeApp|; ?wv\)/i.test(navigator.userAgent||"");
/* 기본 브라우저로 다시 열기 — 카톡은 전용 스킴이 있고, 안드로이드는 intent로 크롬 지정 */
function openExternal(){
  const url = location.href, ua = navigator.userAgent||"";
  try{
    if(/KAKAOTALK/i.test(ua)){ location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url); return; }
    if(/Android/i.test(ua)){
      location.href = "intent://" + url.replace(/^https?:\/\//,"") + "#Intent;scheme=https;package=com.android.chrome;end";
      return;
    }
  }catch(e){}
  alert("오른쪽 위·아래의 ⋯ (또는 공유) 버튼 → '다른 브라우저로 열기' / 'Safari로 열기'를 눌러주세요.");
}
/* 소리가 안 날 때 원인 알려주기 */
function ttsProblem(){
  if(IN_APP) return "inapp";                                   // 카톡 등 앱 안 브라우저 → 소리 기능 없음
  if(!window.speechSynthesis) return "이 브라우저는 소리 읽기를 지원하지 않아요.";
  if(!VOICES.length) loadVoices();
  /* 목록이 다 왔는데도 목소리가 0개 = 이 화면에선 발음이 아예 안 남(대개 앱 안 브라우저).
     예전엔 이 경우 아무 안내도 안 떠서, 사용자는 버튼만 누르며 왜 조용한지 알 수 없었음. */
  if(VOICES_READY && !VOICES.length) return "novoice";
  if(VOICES.length && !viVoices().length) return "이 폰에 <b>베트남어 음성</b>이 없어요. 설치하면 소리가 나요.";
  return "";
}
function viVoices(){ return VOICES.filter(v => (v.lang||"").toLowerCase().replace("_","-").startsWith("vi")); }
/* 홈 화면 위쪽 '소리 안 남' 안내 카드.
   ⚠️ 홈 전체를 다시 그리면 검색창에 치던 글자가 지워지고 화면이 위로 튐.
      그래서 이 카드만 따로 갈아끼울 수 있게 함수로 분리함(ttsWarnRefresh). */
function ttsWarnHTML(){

          <span style="font-weight:600">아래 버튼으로 크롬·사파리에서 열면 소리가 나요.</span>
        </div>

      </div>`;
  if(p==="novoice") return `<div class="card" style="background:var(--warnsoft); border-color:var(--warn); padding:14px">
        <div class="tiny" style="color:var(--warn); font-weight:800; line-height:1.65">
          <svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><use href='#i-volume'/></svg>
          <b>이 화면에서는 발음이 안 나와요.</b> 읽어줄 목소리가 하나도 없어요.<br>
          <span style="font-weight:600">크롬 · 삼성인터넷 · 사파리로 열면 소리가 나요.</span>
        </div>
        <button class="btn" style="margin-top:10px" data-action="openExternal">크롬 · 사파리로 열기</button>

      </div>`;
  return `<div class="card" style="background:var(--warnsoft); border-color:var(--warn); padding:12px 14px">
        <div class="tiny" style="color:var(--warn); font-weight:800; line-height:1.6">
          <svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><use href='#i-volume'/></svg> ${p}
          <button class="chip tiny" style="margin-left:6px" data-action="goVoice">해결 방법 보기</button>
        </div></div>`;
}
/* 목소리 목록이 늦게 도착했을 때, 홈의 안내 카드만 조용히 갱신 */
function ttsWarnRefresh(){
  try{ const el = document.getElementById("ttsWarn"); if(el) el.innerHTML = ttsWarnHTML(); }catch(e){}
}
/* 읽기 속도 기본값 1.0(보통 말 빠르기).
   예전 기본값 0.9는 소리를 억지로 늘려 읽는 방식이라 말이 끊기고 딱딱하게 들렸음.
   더 느리게 듣고 싶으면 '발음(소리) 설정 → 속도'에서 직접 내리면 됨. */
function ttsRate(){ const r = Number(lsGet("_rate", 1.0)); return (r>=0.5 && r<=2) ? r : 1.0; }
/* '인터넷 목소리 사용' 스위치. 기본은 켜짐(더 자연스러운 소리를 그냥 쓰게).
   끄면 기기 안에 저장된 목소리(localService===true)만 씀 → 데이터가 전혀 안 나감. */
function ttsNetOn(){ return lsGet("_ttsnet", true) !== false; }
/* 인터넷 목소리(기기에 저장 안 된 목소리)가 실제로 이 기기에 있는지 */
function hasNetVoice(){ return viVoices().some(v => v.localService === false); }
/* 베트남어일 때만 사용자가 고른 음성 적용. 한국어 등은 OS 기본 음성 사용. */
/* 음성 음질 점수: 이름에 붙은 표시로 '자연스러운 목소리'를 가려냄.
   ㆍ안드로이드(구글 음성): 이름이 vi-vn-x-vif-local / -network 식인데, network 쪽이 훨씬 자연스럽고
     local(compact) 쪽은 옛날 기계음이라 한 글자씩 뚝뚝 끊어 읽는 느낌이 남.
   ㆍ맥·아이폰: Enhanced(향상됨) / Premium 이 붙은 쪽이 자연스러움. */
function voiceScore(v){
  const n = ((v.name||"")+" "+(v.voiceURI||"")).toLowerCase();
  if(/compact|espeak|eloquence|pico/.test(n)) return 0;                  // 옛날식 기계음: 가장 어색함
  if(/premium|wavenet|studio|journey|chirp|siri/.test(n)) return 5;
  if(/neural|network/.test(n)) return 4;
  if(/enhanced|nâng cao/.test(n)) return 3;
  if(/natural/.test(n)) return 2;
  return 1;
}
function isEnhancedVoice(v){ return voiceScore(v) >= 3; }
/* 자동 선택 규칙(2026-07-26 변경):
   예전엔 '기기에 설치된(오프라인)' 음성을 무조건 먼저 골랐음. 그런데 폰에 깔린 기본 음성이

   이제는 ① 음질 점수가 높은 순 ② 점수가 같으면 오프라인 우선. 단, 인터넷이 끊겨 있으면
   온라인 음성은 소리가 아예 안 나므로 오프라인 음성만 후보로 둠. */
/* 안전장치: 온라인 음성이 실제로 소리를 못 낸 적이 있으면, 그 뒤로는 오프라인 음성만 씀.
   (인터넷이 연결돼 있어도 회사·학교 와이파이에서 막히는 경우가 있어서, '소리가 아예 안 남'을 막음) */
let TTS_NET_FAIL = false;
function pickedVoice(lang){
  if(!(lang||"").toLowerCase().startsWith("vi")) return null;
  const vs = viVoices(); if(!vs.length) return null;
  const uri = lsGet("_voiceURI","");
  /* 사용자가 직접 고른 목소리가 1순위. 단, 인터넷 목소리를 꺼둔 상태면 그 선택은 건너뜀 */
  if(uri){ const f = vs.find(v=>v.voiceURI===uri); if(f && (ttsNetOn() || f.localService!==false)) return f; }
  let online = true; try{ online = (navigator.onLine !== false); }catch(e){}
  if(TTS_NET_FAIL) online = false;
  if(!ttsNetOn()) online = false;        // 사용자가 '인터넷 목소리 사용'을 껐으면 기기 안 목소리만
  const offline = vs.filter(v=>v.localService!==false);
  const pool = (online || !offline.length) ? vs : offline;
  return pool.slice().sort((a,b)=>{
    const d = voiceScore(b) - voiceScore(a); if(d) return d;             // ① 음질 좋은 순
    return (a.localService===false?1:0) - (b.localService===false?1:0);  // ② 같으면 오프라인 우선
  })[0] || vs[0];
}

function ttsText(text, lang){
  if(!(lang||"").toLowerCase().startsWith("vi")) return text;   // 베트남어 재생일 때만 교정
  let t = String(text);
  /* ① 기호 정리 — 음성이 기호를 '단어처럼' 읽어 버리는 걸 막음 (화면 글자는 그대로, 소리만 바뀜)
     - 빗금(/): "cảm thấy/thấy" → 음성이 빗금을 '찌아(chia)'처럼 읽어 "캄 터이 친 터이"로 들렸음.
                쉼표로 바꿔 '캄 터이, 터이'처럼 잠깐 쉬고 두 형태를 다 읽게 함.
     - 괄호( ): "bữa (ăn) sáng"의 괄호는 '생략 가능' 표시일 뿐이라 괄호 기호만 지우고
                안의 단어는 살려서 "bữa ăn sáng"으로 읽음. */
  t = t.replace(/\s*\/\s*/g, ", ");    // 빗금 → 쉼표(잠깐 쉼)
  t = t.replace(/[()[\]]/g, " ");      // 괄호 기호만 제거, 안의 단어는 그대로 읽음
  t = t.replace(/…/g, "...").replace(/\.{2,}/g, ",");   // 말줄임표: 마침표를 여러 개로 보고 길게 멈추던 것을 쉼표 한 번으로
  t = t.replace(/\s{2,}/g, " ")        // 위에서 생긴 이중 공백 정리
       .replace(/\s+([,.!?;:])/g, "$1")
       .replace(/,\s*,/g, ",")
       .replace(/,\s*([.!?])/g, "$1")  // "À..., xin lỗi." 처럼 쉼표+마침표가 겹치던 것 정리
       .trim().replace(/^[,;:]\s*/, "").replace(/[,;:]+$/, ".");
  /* ② 사람 이름 등 개별 교정 */
  TTS_FIX.forEach(([re, rep]) => { t = t.replace(re, rep); });
  return t;
}

function ttsKeepStart(){
  if(IS_MOBILE) return;
  TTS_KEEP = setInterval(()=>{
    try{
      if(!speechSynthesis.speaking){ ttsKeepStop(); return; }
      if(speechSynthesis.paused){ speechSynthesis.resume(); return; }   // 이미 멈춰 있으면 풀기만
      speechSynthesis.pause(); speechSynthesis.resume();
    }catch(e){ ttsKeepStop(); }

        ① 음질 등급이 같은 목소리가 2개 이상 있으면 : 사람마다 진짜 다른 목소리를 배정

function spkVoiceOn(){ return lsGet("_spkvoice", true) !== false; }
/* 프로필 : 한 문항(또는 한 대화) 안에서 서로 겹치지 않게 번호로 나눠 씀 */
const SPK_PROFILES = [
  { i:0, pitch:1.12, rate:1.00 },   // 0 : 높은 쪽 (여자로 적혀 있으면 여기)
  { i:1, pitch:0.86, rate:0.98 },   // 1 : 낮은 쪽 (남자로 적혀 있으면 여기)
  { i:2, pitch:1.02, rate:1.07 },   // 2 : 세 번째 사람
  { i:3, pitch:0.94, rate:1.03 },   // 3 : 네 번째 사람
];
const SPK_NARR = { i:-1, pitch:1.00, rate:1.00 };   // 'Q'(문제 읽어주는 목소리)는 건드리지 않음
function spkIsNarr(who){ const w = String(who||"").trim().toLowerCase(); return w==="q" || w==="질문"; }
/* 교재가 대놓고 남/여를 적어 준 화자만 성별로 배정.
   이름(Mai·Hải 같은 것)으로 성별을 넘겨짚으면 틀릴 수 있어서 일부러 안 함. */
function spkSex(who){
  const w = stripDia(String(who||"").toLowerCase()).replace(/\s+/g,"");
  if(w==="nam" || w==="chong") return 1;   // 남자(Nam·Chồng) → 낮은 쪽
  if(w==="nu"  || w==="vo")    return 0;   // 여자(Nữ·Vợ) → 높은 쪽
  return -1;

/* 화자 이름 목록 → { 이름 : 프로필 }. 같은 문항 안에서는 절대 안 겹치게 배정 */
function spkPlan(whos){
  const plan = {}, used = [], order = [];
  (whos||[]).forEach(w=>{ const k = String(w||""); if(k && order.indexOf(k)<0) order.push(k); });
  const take = i => { used[i] = 1; return SPK_PROFILES[i]; };
  order.forEach(k=>{                                   // ① 남/여로 적힌 사람 먼저
    if(spkIsNarr(k)){ plan[k] = SPK_NARR; return; }
    const s = spkSex(k); if(s >= 0 && !used[s]) plan[k] = take(s);
  });
  order.forEach(k=>{                                   // ② 나머지는 나온 차례대로 남은 번호
    if(plan[k]) return;
    let i = 0; while(i < SPK_PROFILES.length && used[i]) i++;
    plan[k] = (i < SPK_PROFILES.length) ? take(i) : SPK_PROFILES[0];   // 5명 넘으면 첫 번째를 다시 씀
  });

}
/* 지금 쓸 수 있는 베트남어 목소리 중 '음질 등급이 같은' 것만 모음.

function spkPool(){
  const base = pickedVoice("vi-VN"); if(!base) return [];
  let vs = viVoices();
  if(!ttsNetOn() || TTS_NET_FAIL) vs = vs.filter(v=>v.localService!==false);
  const s = voiceScore(base);
